[registers.clock1_mode]
offset = 16
access = "rw"
width = 16
space = "codec_reg"
grade = "established"
reset = 0x00ff
reset_from = "AD1843 REV.0 (1996) page 39"
doc = """
Mode of generator 1. Clock 2 and clock 3 use the same layout at registers 19 and 22. Bits 9 and 8 are not defined (established, register pages 38 to 43)."""

[registers.clock1_mode.fields]
c1ref = { bits = [15, 15], grade = "established", doc = "Reference select. 0 references the generator to the XTALI crystal or master clock input, with the sample rate from the hz register and the phase shiftable. 1 references it to the SYNC pin, with the sample phase locked and the hz and phase registers ignored (AD1843 REV.0 page 37)." }
c1vid = { bits = [14, 14], grade = "established", doc = "Video lock mode, used only when the reference is the SYNC pin and written zero otherwise. 0 is normal lock with a bit clock. 1 is video lock, where the conversion rate comes from the clock modifier bits and no bit clock is produced (AD1843 REV.0 page 38)." }
c1pllg = { bits = [13, 13], grade = "established", doc = "PLL loop gain. 0 selects finite loop gain, the nominal setting. 1 selects infinite gain, which may help locking to some SYNC inputs and may add conversion noise (AD1843 REV.0 page 38)." }
c1p200 = { bits = [12, 12], grade = "established", doc = "Adds 200 Hz to the BIT rate. The scaling order is an interpretation (see devices/mace_audio/mace-audio.md)." }
c1x8_7 = { bits = [11, 11], grade = "established", doc = "Scales the conversion rate by 8/7." }
c1c128 = { bits = [10, 10], grade = "established", doc = "Scales the CONV output by 128." }
c1m_7_4 = { bits = [7, 4], grade = "established", doc = "Conversion code, see the BIT and CONV table in devices/mace_audio/mace-audio.md." }
c1m_3_0 = { bits = [3, 0], grade = "established", doc = "BIT code, see the BIT and CONV table in devices/mace_audio/mace-audio.md." }

