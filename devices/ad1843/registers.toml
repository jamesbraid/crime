hpom = { bits = [5, 5], grade = "established" }
hpos = { bits = [4, 4], grade = "established", doc = "Headphone output voltage swing, both channels: 0 is 2 V peak-to-peak, 1 is 4 V peak-to-peak." }
summ = { bits = [3, 3], grade = "established", doc = "Mute of the external SUML and SUMR inputs, which enter through the SUMM node." }
