lmge = { bits = [12, 12], grade = "established" }
lig = { bits = [11, 8], grade = "established" }
rss = { bits = [7, 5], grade = "established", enum = "analog_source" }
rmge = { bits = [4, 4], grade = "established" }
rig = { bits = [3, 0], grade = "established" }

