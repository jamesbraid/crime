access = "rw"
width = 16
space = "codec_reg"
grade = "established"
reset = 0x00c0
reset_from = "AD1843 REV.0 (1996) page 49"
doc = "Power and enable bits for the converters, ADCs, analog paths and headphone output. Registers 1 to 15, 25 and 27 are held at reset while converter power-down is set (established, register pages 28-50)."

[registers.enables.fields]
dfree = { bits = [15, 15], grade = "established", doc = "Digital resource free. 1 leaves the digital resources of powered-down channels available to the enabled ones, which allows conversion rates above the 49 kHz limit with all four converters running. 0 powers them down completely." }
ddmen = { bits = [12, 12], grade = "established", doc = "DAC2-to-DAC1 mix enable and power down. 0 powers the mix down and clears register 3 (dac2_to_dac1_mix), which then cannot be written; 1 enables it." }
da2en = { bits = [9, 9], grade = "established" }
da1en = { bits = [8, 8], grade = "established" }
anaen = { bits = [7, 7], grade = "established" }
hpen = { bits = [6, 6], grade = "established", doc = "Powers only the stereo headphone driver. The mono output is separate." }
aamen = { bits = [4, 4], grade = "established" }
adren = { bits = [1, 1], grade = "established" }
adlen = { bits = [0, 0], grade = "established" }

[registers.power_clock]
offset = 28
access = "rw"
width = 16
space = "codec_reg"
grade = "established"
reset = 0xc400
reset_from = "AD1843 REV.0 (1996) page 50"
doc = """
Converter power, auto-calibration, generator enables, clock output and the line input modes. Bit 15 is PDNI, which resets to 1. Clearing it starts converter startup. Auto-calibration cannot be cleared before the first completed startup (established, register pages 28-50 and the initialisation text)."""

[registers.power_clock.fields]
pdni = { bits = [15, 15], grade = "established" }
acen = { bits = [14, 14], grade = "established" }
c3en = { bits = [13, 13], grade = "established" }
c2en = { bits = [12, 12], grade = "established" }
c1en = { bits = [11, 11], grade = "established" }
enclko = { bits = [10, 10], grade = "established", doc = "Drives the external CLKOUT pin. It does not gate the MACE serial clock." }
xctl = { bits = [9, 8], grade = "established", doc = "Drive the independent TTL outputs XCTL1 and XCTL0. They do not control the crystal oscillator." }
encv3 = { bits = [7, 7], grade = "established", doc = "CONV3 pin enable. Zero three-states the pin." }
enbt3 = { bits = [6, 6], grade = "established", doc = "BIT3 pin enable. Zero three-states the pin." }
encv2 = { bits = [5, 5], grade = "established", doc = "CONV2 pin enable. Zero three-states the pin." }
enbt2 = { bits = [4, 4], grade = "established", doc = "BIT2 pin enable. Zero three-states the pin." }
encv1 = { bits = [3, 3], grade = "established", doc = "CONV1 pin enable. Zero three-states the pin." }
enbt1 = { bits = [2, 2], grade = "established", doc = "BIT1 pin enable. Zero three-states the pin." }
linrsd = { bits = [1, 1], grade = "established", enum = "line_mode" }
linlsd = { bits = [0, 0], grade = "established", enum = "line_mode" }
