[registers.mono_control]
offset = 8
access = "rw"
width = 16
space = "codec_reg"
grade = "established"
reset = 0x8868
doc = """
Mono mix gain and mute in the upper byte. The lower byte holds the all-mix mute, the mono and headphone mutes, the output swing, the sum mute and the gain-change timing of each DAC (established, register page 33). The all-mix mute is read from the detailed diagram as covering the DAC2, AUX1 to AUX3 and microphone analog contributions only (inferred). The prose describes it more broadly, and the two readings conflict (see docs/mace-audio.md)."""

[registers.mono_control.fields]
mono_mix_mute = { bits = [15, 15], grade = "established" }
mono_mix_gain = { bits = [12, 8], grade = "established" }
all_mix_mute = { bits = [7, 7], grade = "inferred", doc = "Scope from the diagram, see the register doc." }
mono_mute = { bits = [6, 6], grade = "established" }
headphone_mute = { bits = [5, 5], grade = "established" }
swing = { bits = [4, 4], grade = "established", doc = "Named swing in the register table. The datasheet gives no further meaning for this bit." }
sum_mute = { bits = [3, 3], grade = "established", doc = "Mute of the external SUML and SUMR inputs, which enter through the SUMM node." }
dac2_gain_timing = { bits = [1, 1], grade = "established", enum = "gain_timing" }
dac1_gain_timing = { bits = [0, 0], grade = "established", enum = "gain_timing" }

