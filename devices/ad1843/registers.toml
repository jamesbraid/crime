# Hardware definitions. Edit this file; generated/ is generated from it.
unit = "ad1843"
prefix = "AD1843"
title = "Analog Devices AD1843 stereo codec: the 29 internal registers"
doc = "The AD1843 serial-port codec used by the O2 MACE audio interface. Register numbers are the codec's own, not MACE byte offsets, and are reached through the MACE codec command register (mace_audio.toml, codec_cmd). Each register is 16 bits. Field masks follow the published register table; bits the table does not define are not listed."
from = "Analog Devices AD1843 Serial-Port 16-Bit SoundComm Codec, REV.0 (1996): register pages 28-50 and the register summary on page 52. The PDF is not stored in this repository, so these values were not re-checked against it here."
public_from = ["Analog Devices AD1843 Serial-Port 16-Bit SoundComm Codec, REV.0 (1996)"]

[spaces.codec_reg]
unit = "reg"
doc = "Codec register numbers. Offsets in this unit are register numbers, not bytes."

[enums.analog_source]
doc = "ADC analog input selection, one per channel."

[enums.analog_source.values]
line = { value = 0, grade = "established" }
mic = { value = 1, grade = "established" }
aux1 = { value = 2, grade = "established" }
aux2 = { value = 3, grade = "established" }
aux3 = { value = 4, grade = "established" }
mono_in = { value = 5, grade = "established" }
dac1_out = { value = 6, grade = "established", doc = "DAC1 analog output after its gain and mute (published post-mixed description; the exact physical tap is not established)." }
dac2_out = { value = 7, grade = "established", doc = "DAC2 analog output after its gain and mute." }

[enums.pcm_format]
doc = "Serial sample format of a converter or ADC."

[enums.pcm_format.values]
unsigned8 = { value = 0, grade = "established", doc = "8-bit unsigned linear, carried in serial bits 15:8." }
signed16 = { value = 1, grade = "established", doc = "16-bit two's complement." }
mulaw = { value = 2, grade = "established", doc = "8-bit mu-law (ITU-T G.711 characters), carried in serial bits 15:8." }
alaw = { value = 3, grade = "established", doc = "8-bit A-law (ITU-T G.711 characters), carried in serial bits 15:8." }

[enums.digital_source]
doc = "ADC digital source. Code 1 is reserved."

[enums.digital_source.values]
analog = { value = 0, grade = "established" }
reserved = { value = 1, grade = "established" }
dac1 = { value = 2, grade = "established" }
dac2 = { value = 3, grade = "established" }

[enums.clock_select]
doc = "Sample-rate source for a converter or ADC."

[enums.clock_select.values]
fixed48k = { value = 0, grade = "established", doc = "Fixed 48 kHz clock." }
gen1 = { value = 1, grade = "established" }
gen2 = { value = 2, grade = "established" }
gen3 = { value = 3, grade = "established" }

[enums.line_mode]
doc = "Line input wiring for one channel."

[enums.line_mode.values]
single_ended = { value = 0, grade = "established" }
differential = { value = 1, grade = "established" }

[enums.gain_timing]
doc = "When a DAC gain change takes effect."

[enums.gain_timing.values]
zero_cross = { value = 0, grade = "established", doc = "Waits for a zero crossing of the signal, or a timeout." }
immediate = { value = 1, grade = "established", doc = "Applies at the register write." }

[registers.status_id]
offset = 0
access = "rw"
width = 16
space = "codec_reg"
grade = "established"
reset = 0xc001
doc = """
INIT, the converter power-down state and the silicon revision. Reset sets INIT and power-down, so the codec starts in initialisation. The revision field is read-only and resets to 1, the first-silicon value in the table; the revision of a fitted part is not measured here (established, register pages 28-50 and summary page 52)."""

[registers.status_id.fields]
init = { bits = [15, 15], grade = "established", doc = "INIT. Blocks control writes while it is set." }
converter_powerdown = { bits = [14, 14], grade = "established", doc = "Holds the registers 1 to 15, 25 and 27 at their reset values and blocks their writes." }
revision = { bits = [3, 0], grade = "established", doc = "Read-only silicon revision." }

[registers.underrun_peak]
offset = 1
access = "rw"
width = 16
space = "codec_reg"
grade = "established"
reset = 0x0
doc = """
DAC underrun flags and the peak level of each ADC channel. A read returns the status and clears all of it. Any write clears all of it too, so this register is not write-one-to-clear (established, register pages 28-50)."""

[registers.underrun_peak.fields]
dac2_underrun = { bits = [9, 9], grade = "established" }
dac1_underrun = { bits = [8, 8], grade = "established" }
r_peak = { bits = [3, 2], grade = "established", doc = "Largest right ADC level since the last clear: more than 1 dB below full scale, within 1 dB below, 0 to 1 dB above, more than 1 dB above, in increasing order." }
l_peak = { bits = [1, 0], grade = "established", doc = "Largest left ADC level since the last clear, same four levels as r_peak." }

[registers.adc_input]
offset = 2
access = "rw"
width = 16
space = "codec_reg"
grade = "established"
reset = 0x0
doc = """
Analog source, microphone boost and gain for each ADC channel. The gain steps are 1.5 dB per code and the microphone boost adds 20 dB (established, register pages 28-50 and the routing text)."""

[registers.adc_input.fields]
l_source = { bits = [15, 13], grade = "established", enum = "analog_source" }
l_mic_boost = { bits = [12, 12], grade = "established" }
l_gain = { bits = [11, 8], grade = "established" }
r_source = { bits = [7, 5], grade = "established", enum = "analog_source" }
r_mic_boost = { bits = [4, 4], grade = "established" }
r_gain = { bits = [3, 0], grade = "established" }

[registers.dac2_to_dac1_mix]
offset = 3
access = "rw"
width = 16
space = "codec_reg"
grade = "inferred"
reset = 0x8888
doc = """
Analog mix of DAC2 into the DAC1 output. Page 53 identifies the register as DAC2-to-DAC1 mixing; the summary's own names for it differ (inferred). Gain is 12 minus 1.5 times the code, in dB. The mute bits are separate from the gain."""

[registers.dac2_to_dac1_mix.fields]
l_mute = { bits = [15, 15], grade = "established" }
l_gain = { bits = [12, 8], grade = "established" }
r_mute = { bits = [7, 7], grade = "established" }
r_gain = { bits = [4, 0], grade = "established" }

