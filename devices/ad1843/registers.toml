immediate = { value = 1, grade = "established", doc = "Applies at the register write." }

[registers.status_id]
offset = 0
access = "r"
width = 16
space = "codec_reg"
grade = "established"
reset = 0xc001
reset_from = "AD1843 REV.0 (1996) page 28"
doc = """
INIT, the converter power-down state and the silicon revision. Read-only ([AD1843 REV.0 page 28]). Reset sets INIT and power-down, so the codec starts in initialisation. The revision field is read-only and resets to 1, the first-silicon value in the table; the revision of a fitted part is not measured here (established, register pages 28-50 and summary page 52)."""

[registers.status_id.fields]
init = { bits = [15, 15], grade = "established", doc = "INIT. Blocks control writes while it is set." }
pdno = { bits = [14, 14], grade = "established", doc = "Holds the registers 1 to 15, 25 and 27 at their reset values and blocks their writes." }
id = { bits = [3, 0], grade = "established", doc = "Read-only silicon revision." }

[registers.underrun_peak]
offset = 1
access = "rw"
width = 16
space = "codec_reg"
grade = "established"
reset = 0x0
reset_from = "AD1843 REV.0 (1996) page 29"
doc = """
DAC underrun flags and the peak level of each ADC channel. A read returns the status and clears all of it. Any write clears all of it too, so this register is not write-one-to-clear (established, register pages 28-50)."""

[registers.underrun_peak.fields]
su2 = { bits = [9, 9], grade = "established" }
su1 = { bits = [8, 8], grade = "established" }
ovr = { bits = [3, 2], grade = "established", doc = "Largest right ADC level since the last clear: more than 1 dB below full scale, within 1 dB below, 0 to 1 dB above, more than 1 dB above, in increasing order." }
ovl = { bits = [1, 0], grade = "established", doc = "Largest left ADC level since the last clear, same four levels as ovr." }

[registers.adc_input]
offset = 2
access = "rw"
width = 16
space = "codec_reg"
grade = "established"
reset = 0x0
reset_from = "AD1843 REV.0 (1996) page 29"
doc = """
Analog source, microphone boost and gain for each ADC channel. The gain steps are 1.5 dB per code and the microphone boost adds 20 dB (established, register pages 28-50 and the routing text)."""

[registers.adc_input.fields]
