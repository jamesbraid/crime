scf = { bits = [7, 7], grade = "established", doc = "Selects the 16.384 MHz serial clock instead of the 12.288 MHz reset clock." }
frs = { bits = [6, 6], grade = "established", doc = "0 gives 32 serial slots per SDFS frame, 1 gives 16." }
frst = { bits = [5, 5], grade = "established", doc = "1 requests an immediate change of the frame size, 0 applies it after the current frame." }
adtlk = { bits = [4, 4], grade = "established", doc = "ADC transmit lock mode. 1 sends a left and right ADC sample in a frame only when both are ready, so the pair stays together; 0 sends each as it becomes ready. Set it only while both ADCs are off and program both to the same rate once they are enabled. While it is set, enable and disable both ADCs together." }
adrf = { bits = [3, 2], grade = "established", enum = "pcm_format" }
adlf = { bits = [1, 0], grade = "established", enum = "pcm_format" }

