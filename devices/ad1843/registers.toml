[registers.format_lock.fields]
da2sm = { bits = [15, 15], grade = "established", doc = "Mono DAC2 mode: duplicates the left input and ignores the right." }
da1sm = { bits = [14, 14], grade = "established", doc = "Mono DAC1 mode: duplicates the left input and ignores the right." }
