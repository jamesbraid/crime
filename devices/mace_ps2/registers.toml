# Hardware definitions. Edit this file; generated/ is generated from it.
unit = "mace_ps2"
prefix = "MACE_PS2"
title = "O2 MACE PS/2 keyboard and mouse ports"
doc = "MACE PS/2 keyboard and mouse ports: one serial port per device, each with a transmit buffer, a receive buffer, a control register and a status register. Offsets are from the port's bank base (constants KEYBOARD_BASE and MOUSE_BASE)."
from = "published MACE 2.0 I/O ASIC specification (printed pages 139 to 142 and 181)"
public_from = ["published MACE 2.0 I/O ASIC specification"]

# Every register is 64-bit aligned and read or written with 64-bit programmed
# I/O (established, printed page 140). The specification does not say what a
# narrower access does (unknown). Bits not defined read as zero.

[registers.transmit]
offset = 0x0
access = "w"
width = 64
reset = 0x0
grade = "established"
doc = """
Transmit buffer, bits 7:0: the byte currently shifted out of the data line (established, printed page 140, table 71). Write only. Reset zero (established, printed page 141)."""

[registers.transmit.fields]
byte = { bits = [7, 0], grade = "established" }

[registers.receive]
offset = 0x8
access = "r"
width = 64
reset = 0x0
grade = "established"
doc = """
Receive buffer. Bits 7:0 are the byte currently shifted in from the data line; bits 15:8 are an alias of the status register (established, printed page 140, table 72). Read only. Both parts reset to zero (established, printed page 140). The status table resets status bit 1, which this alias mirrors at bit 9, to one (printed page 142), so the alias reset conflicts between the two tables (established as printed; the reset level of bit 9 is unknown)."""

[registers.receive.fields]
byte = { bits = [7, 0], grade = "established" }
status_alias = { bits = [15, 8], grade = "established", doc = "Alias of the status register bits 7:0 (printed page 140)." }

[registers.control]
offset = 0x10
access = "rw"
width = 64
reset = 0x10
grade = "established"
doc = """
Command and control, bits 5:0 (established, printed page 141, table 73). Reset to 0x10, which sets only the clock-permit bit (established, printed page 141). Bits 7:6 are not defined."""

[registers.control.fields]
inhibit_after_transmit = { bits = [0, 0], grade = "established", doc = "One releases the clock output after the next serial stream is transmitted; zero keeps it asserted (printed page 141)." }
transmit_enable = { bits = [1, 1], grade = "established", doc = "One lets the transmit buffer shift out on the data line, on the falling edge of the device clock; zero disables that shift and the timeout (printed page 141). The timeout itself is not defined in the specification (unknown)." }
transmit_interrupt_enable = { bits = [2, 2], grade = "established", doc = "One asserts the port interrupt when the transmit buffer is empty (printed page 141)." }
receive_interrupt_enable = { bits = [3, 3], grade = "established", doc = "One asserts the port interrupt when the receive buffer is full (printed page 141)." }
clock_permit = { bits = [4, 4], grade = "established", doc = "One asserts the clock output, which lets the device exchange data; zero releases it and pauses both directions (printed page 141). Resets to one." }
internal_reset = { bits = [5, 5], grade = "established", doc = "One holds the port's internal state machines in reset; zero releases them (printed page 141). Reset to zero." }

[registers.status]
offset = 0x18
access = "r"
width = 64
grade = "established"
doc = """
Transmit and receive status and error flags, bits 7:0 (established, printed page 142, table 74). Read only. The table gives bit 0 an unknown reset level and bit 3 a reset of zero, which the table prints although the transmitter is idle; bit 1 resets to one. No single reset word is given, so the register has no fixed reset value (unknown)."""

[registers.status.fields]
clock_level = { bits = [0, 0], grade = "established", doc = "Level of the external device clock: one when asserted, zero when de-asserted (printed page 142). Reset not fixed." }
clock_permitted = { bits = [1, 1], grade = "established", doc = "The output that the clock-permit control bit drives: one when the clock is asserted. Resets to one (printed page 142)." }
transmit_in_progress = { bits = [2, 2], grade = "established", doc = "One while the data line is shifting an output byte (printed page 142). Resets to zero." }
transmit_empty = { bits = [3, 3], grade = "established", doc = "One when the transmit buffer is empty and zero while it holds a byte waiting to be sent (printed page 142). Resets to zero in the table." }
receive_full = { bits = [4, 4], grade = "established", doc = "One when the receive buffer holds a byte waiting to be read (printed page 142). Resets to zero." }
reception_in_progress = { bits = [5, 5], grade = "established", doc = "One while the port is receiving a byte (printed page 142). Resets to zero." }
parity_error = { bits = [6, 6], grade = "established", doc = "One when the last received byte had a parity error (printed page 142). The specification does not say when this flag is cleared (unknown)." }
framing_error = { bits = [7, 7], grade = "established", doc = "One when the last received byte had a framing error (printed page 142). The specification does not say when this flag is cleared (unknown)." }

[constants]
BLOCK_BASE = { value = 0x1f320000, grade = "established", doc = "physical base of the keyboard and mouse slice, sub-block 010 of the peripheral controller (printed page 181, table 92)" }
KEYBOARD_BASE = { value = 0x0, grade = "established", doc = "keyboard port bank, offset from BLOCK_BASE; address bit 5 is zero (printed page 181, table 93)" }
MOUSE_BASE = { value = 0x20, grade = "established", doc = "mouse port bank, offset from BLOCK_BASE; address bit 5 is one (printed page 181, table 93)" }
FRAME_BITS = { value = 11, grade = "established", doc = "bits in one serial stream: start (0), eight data bits least significant first, odd parity, stop (1) (printed page 139, table 69)" }
DEVICE_POLL_INTERVAL_US = { value = 100, grade = "established", doc = "the auxiliary device polls the clock at this interval; software must allow settling time after changing clock permit (printed page 141)" }
