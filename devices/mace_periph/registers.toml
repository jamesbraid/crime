# Hardware definitions. Edit this file; generated/ is generated from it.
unit = "mace_periph"
prefix = "MACE_PERIPH"
title = "O2 MACE peripheral ring base and interrupt status and mask"
doc = "MACE peripheral block: the serial and parallel ring base with external reset, and the peripheral interrupt status and mask. Offsets are from the block base (constant BLOCK_BASE)."
from = "published MACE 2.0 I/O ASIC specification (printed pages 123, 125 and 147), public Linux O2 interrupt code, and OpenBSD and NetBSD O2 MACE drivers"
public_from = ["published MACE 2.0 I/O ASIC specification"]

# Access direction is taken from the register table. The prose and table
# disagree for the status register; see questions/README.md.

[registers.ring_base]
offset = 0x0
access = "rw"
width = 64
grade = "established"
doc = """
Bit 0 asserts the external serial and parallel controller reset; it resets to one and writing zero releases it (established, printed page 123). That reset drives the RstISA pin in the ISA pin group, not a PCI pin (established, printed page 185). Bits 31:15 hold the 32 KiB-aligned base of the peripheral DMA rings (established, printed page 123). Bits 14:1 are not described."""

[registers.ring_base.fields]
ext_reset = { bits = [0, 0], grade = "established" }
dma_ring_base = { bits = [31, 15], grade = "established" }

[registers.misc_control]
offset = 0x08
access = "rw"
width = 64
reset = 0x20
grade = "established"
doc = """
Flash-ROM, Number-In-a-Can line, LED, DP-RAM and test control. Bits 8:0 are defined and the rest read zero (established, printed page 122). Reset is 0x20: only the green LED disable bit is set (established, printed page 124). Like the other registers in the block it is 64-bit aligned and read or written by 64-bit programmed I/O. The specification does not say what a narrower access does (unknown, printed page 122)."""

[registers.misc_control.fields]
flash_write_enable = { bits = [0, 0], grade = "established", doc = "1 enables writes to the external Flash-ROM. 0 sends writes into a bit bucket (printed page 124)." }
password_clear_enable = { bits = [1, 1], grade = "established", doc = "Read-only. 1 means the external password clear is enabled (printed page 124)." }
nic_deassert = { bits = [2, 2], grade = "established", doc = "Drives the Number-In-a-Can line. 0 holds the bidirectional line low. 1 is no operation, so the line is released. Resets to 0 (printed page 124)." }
nic_level = { bits = [3, 3], grade = "established", doc = "Read-only. The current level of the Number-In-a-Can line: 0 is low, 1 is high. The reset column prints 0 (printed page 124)." }
red_led_enable = { bits = [4, 4], grade = "established", doc = "0 enables the red LED colour and 1 disables it. Resets to 0 (printed page 124)." }
green_led_enable = { bits = [5, 5], grade = "established", doc = "0 enables the green LED colour and 1 disables it. Resets to 1 (printed page 124)." }
dpram_write_enable = { bits = [6, 6], grade = "established", doc = "1 enables PIO writes to the DP-RAM. Resets to 0 (printed page 124)." }
test_ust_timer = { bits = [7, 7], grade = "established", doc = "1 selects the timer test mode. Resets to 0 (printed page 124)." }
sa20_enable = { bits = [8, 8], grade = "established", doc = "0 leaves SA20 as an address bit. 1 makes it the game port chip select. Resets to 0 (printed page 124)." }

[registers.periph_status]
offset = 0x10
access = "rw"
width = 64
grade = "established"
doc = """
Level sources summed into CRIME interrupt groups. Bits 16, 22 and 28 are read/write for external parallel and serial-DMA edge requests; the other listed sources are read-only (established, printed page 125). Timer compares 0, 1 and 2 are bits 13, 14 and 15, the RTC is bit 8, serial device A is bit 20 and serial device B is bit 26 (established, printed page 125). Status bits 0 to 7 OR into CRIME bit 6, bits 8 to 15 into CRIME bit 5 and bits 16 to 31 into CRIME bit 4. A group signals CRIME whenever its level changes (established, printed page 179)."""

[registers.periph_status.fields]
rtc = { bits = [8, 8], grade = "established" }
timer_cmp0 = { bits = [13, 13], grade = "established" }
timer_cmp1 = { bits = [14, 14], grade = "established" }
timer_cmp2 = { bits = [15, 15], grade = "established" }
serial_a = { bits = [20, 20], grade = "established" }
serial_b = { bits = [26, 26], grade = "established" }
serial_a_tx_threshold = { bits = [21, 21], grade = "established", doc = "Read-only. The port 1 transmit ring meets its interrupt threshold (printed page 125)." }
serial_a_tx_pair = { bits = [22, 22], grade = "established", doc = "Read/write. A transmit pair with its interrupt bit set has been processed (printed page 125). The write behaviour is not given; see devices/mace_serial_dma/mace-serial-dma.md." }
serial_a_tx_error = { bits = [23, 23], grade = "established", doc = "Read-only. A memory error stopped the port 1 transmit DMA; the channel is fatally stopped (printed page 125)." }
serial_a_rx_threshold = { bits = [24, 24], grade = "established", doc = "Read-only. The port 1 receive ring meets its interrupt threshold (printed page 125)." }
serial_a_rx_overrun = { bits = [25, 25], grade = "established", doc = "Read-only. A UART overrun was indicated during receive DMA; the channel has stopped (printed page 125)." }
serial_b_tx_threshold = { bits = [27, 27], grade = "established", doc = "Read-only. The port 2 transmit ring meets its interrupt threshold (printed page 125)." }
serial_b_tx_pair = { bits = [28, 28], grade = "established", doc = "Read/write. A port 2 transmit pair with its interrupt bit set has been processed (printed page 125). The write behaviour is not given; see devices/mace_serial_dma/mace-serial-dma.md." }
serial_b_tx_error = { bits = [29, 29], grade = "established", doc = "Read-only. A memory error stopped the port 2 transmit DMA; the channel is fatally stopped (printed page 125)." }
serial_b_rx_threshold = { bits = [30, 30], grade = "established", doc = "Read-only. The port 2 receive ring meets its interrupt threshold (printed page 125)." }
serial_b_rx_overrun = { bits = [31, 31], grade = "established", doc = "Read-only. A UART overrun was indicated during receive DMA; the channel has stopped (printed page 125)." }
ps2_kbd_irq = { bits = [9, 9], grade = "established", doc = "Read-only. Keyboard port interrupt request (established, printed page 125, slot 5). See the PS/2 unit." }
ps2_kbd_poll = { bits = [10, 10], grade = "established", doc = "Read-only. Unmasked keyboard poll flag, the non-interrupt version of the keyboard request (established, printed page 125, slot 5)." }
ps2_mouse_irq = { bits = [11, 11], grade = "established", doc = "Read-only. Mouse port interrupt request (established, printed page 125, slot 5)." }
ps2_mouse_poll = { bits = [12, 12], grade = "established", doc = "Read-only. Unmasked mouse poll flag, the non-interrupt version of the mouse request (established, printed page 125, slot 5)." }
audio_codec_mask = { bits = [0, 0], grade = "established", doc = "Read-only. The last codec response ANDed with the codec response mask is nonzero (printed page 125, slot 6)." }
audio_volume = { bits = [1, 1], grade = "established", doc = "Read-only. A volume push button edge is latched (printed page 125, slot 6)." }
audio_capture_threshold = { bits = [2, 2], grade = "established", doc = "Read-only. The capture ring meets its interrupt threshold (printed page 125, slot 6)." }
audio_capture_overflow = { bits = [3, 3], grade = "established", doc = "Read-only. Capture DMA FIFO overflow error (printed page 125, slot 6)." }
audio_playback1_threshold = { bits = [4, 4], grade = "established", doc = "Read-only. The playback 1 ring meets its interrupt threshold (printed page 125, slot 6)." }
audio_playback1_error = { bits = [5, 5], grade = "established", doc = "Read-only. A memory error on the playback 1 DMA; the channel has stopped (printed page 125, slot 6)." }
audio_playback2_threshold = { bits = [6, 6], grade = "established", doc = "Read-only. The playback 2 ring meets its interrupt threshold (printed page 125, slot 6)." }
audio_playback2_error = { bits = [7, 7], grade = "established", doc = "Read-only. A memory error on the playback 2 DMA; the channel has stopped (printed page 125, slot 6)." }

[registers.periph_mask]
offset = 0x18
access = "rw"
width = 64
grade = "established"
doc = """
Gates delivery of the status bits. A mask bit does not clear the device condition behind a status bit (established, printed pages 125 and 147). Reset value not stated."""

[constants]
BLOCK_BASE = { value = 0x1f310000, grade = "established", doc = "physical base of the peripheral ring and status block (printed page 123)" }
ISA_BASE = { value = 0x1f380000, grade = "established", doc = "physical base of the external ISA I/O space (address map, printed page 181)" }
ISA_REG_STRIDE = { value = 0x100, grade = "established", doc = "each external 8-bit register occupies a 256-byte slice (printed page 133)" }
SERIAL_A_BASE = { value = 0x1f390000, grade = "established", doc = "external 16550-compatible serial port COM 1, at the ISA base plus 0x10000 (printed page 133)" }
SERIAL_B_BASE = { value = 0x1f398000, grade = "established", doc = "external 16550-compatible serial port COM 2, at the ISA base plus 0x18000 (printed page 133)" }
RTC_BASE = { value = 0x1f3a0000, grade = "established", doc = "external Dallas calendar clock, at the ISA base plus 0x20000 (printed page 133); its register contents are in the clock's own contract, not here" }
