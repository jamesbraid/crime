# Hardware definitions. Edit this file; generated/ is generated from it.
unit = "mace_pci"
prefix = "MACE_PCI"
title = "O2 MACE PCI host bridge control registers"
doc = "MACE PCI control block: error capture, interrupt and error enables, read-buffer revision, and the configuration address and data ports. Offsets are from the block base (constant BLOCK_BASE). Only these six registers exist in the block, and they are not repeated across it (established, printed pages 161 and 181). A read of any other offset in the block returns 0xff in each byte position it covers, and a write to one is discarded (established, printed pages 161 and 162)."
from = "published MACE 2.0 I/O ASIC specification (printed pages 161 to 165), public Linux MACE PCI accessor, and OpenBSD and NetBSD O2 MACE drivers"
public_from = ["published MACE 2.0 I/O ASIC specification"]

[registers.pci_error_addr]
offset = 0x0
access = "r"
width = 32
grade = "established"
reset = 0x0
doc = """
Captured address of a PCI error. Valid only while the address-valid flag is set (established, printed pages 162 and 163)."""

[registers.pci_error_flags]
offset = 0x4
access = "rw"
width = 32
grade = "established"
doc = """
Error flags. Bits 23 to 31 and bit 4 clear when written as zero; writing one preserves them (established, printed page 162). A bad transaction size may set bit 27; the specification calls that result unexpected, so it is not named here. Each of bits 28 to 31 has an address-valid partner at bits 16 to 19 (bit 28 with 16, through bit 31 with 19). Clearing an error bit also clears its partner. The error address then keeps its value but is invalid until another qualifying error (established, printed pages 162 and 163)."""

[registers.pci_error_flags.fields]
read_buffer_overrun = { bits = [23, 23], grade = "established" }
parity = { bits = [24, 24], grade = "established" }
system_error = { bits = [26, 26], grade = "established" }
retry = { bits = [28, 28], grade = "established" }
data_parity = { bits = [29, 29], grade = "established" }
target_abort = { bits = [30, 30], grade = "established" }
addr_valid = { bits = [19, 19], grade = "established" }
master_abort = { bits = [31, 31], grade = "established" }

[registers.pci_control]
offset = 0x8
access = "rw"
width = 32
grade = "established"
doc = """
Enables for the PCI inputs (bits 0 to 7), SERR_N signalling (bit 8), parity-error response (bit 10) and the error interrupts (bits 24 to 31). Every bit resets to zero (established, printed pages 164 and 165, Table 85). Bit 9 is reserved on revision 0 and an arbiter control on revision 1. Input n of bits 0 to 7 reaches CRIME bit 8 plus n, and PCI error conditions reach CRIME bit 7 (established, printed page 179)."""

[registers.pci_control.fields]
irq_enable = { bits = [7, 0], grade = "established" }
serr_enable = { bits = [8, 8], grade = "established", doc = "SERR_N signalling enable (printed page 164)." }
parity_response = { bits = [10, 10], grade = "established", doc = "Parity-error response enable (printed page 164)." }
read_multiple = { bits = [11, 11], grade = "established", doc = "Memory Read Multiple read-ahead. Set, a Memory Read Multiple may fetch the next 128-byte region when the master reads across a 128-byte boundary. Clear, Memory Read Multiple behaves like Memory Read and Memory Read Line (printed pages 158 and 164)." }
park_last_in_use = { bits = [15, 15], grade = "established", doc = "PCI arbiter parking. Zero parks the bus grant on the host; one parks it on the last master in use (printed page 164, the PCI Control table). Reset zero. The published text gives no grant timing for either value." }
read_buffer_inval = { bits = [23, 16], grade = "established", doc = "Bit 16 plus n selects read-buffer invalidation when PCI input n asserts. The bit-16 row names prefetch buffers for input 0, and the rows for bits 17 to 23 name all read buffers. The printed text keeps that split, and it is kept here pending review (printed pages 164 and 165)." }
error_enable = { bits = [31, 24], grade = "established" }

[registers.pci_rev]
offset = 0xc
access = "rw"
width = 32
grade = "established"
doc = """
Read-buffer flush and revision. Reads return 1 for MACE 2.0 and 0 for the first MACE, revision 1.0 (established, printed page 165). Any write requests buffer invalidation, whatever value it carries (established, printed page 165). The reset value of the read is not stated."""

[registers.pci_cfg_addr]
offset = 0xcf8
access = "rw"
width = 32
grade = "established"
doc = """
Configuration address port, PCI mechanism 1, bus zero on the directly attached bus. Access width is 32 bits for the address write (established, printed page 161)."""

[registers.pci_cfg_data]
offset = 0xcfc
access = "rw"
width = 32
grade = "established"
doc = """
Configuration data port. Accepts 8-, 16-, 24- or 32-bit data access. A missing device gives a master abort, and the specification gives no value to return for it (established, printed pages 161 to 163)."""

[constants]
BLOCK_BASE = { value = 0x1f080000, grade = "established", doc = "physical base of the PCI control block (printed page 161)" }
