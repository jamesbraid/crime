# Hardware definitions. Edit this file; generated/ is generated from it.
unit = "gbe"
prefix = "GBE"
title = "O2 GBE display back end register words"
doc = "GBE display back end register words, tables and offsets."
from = "published GBE 1.1 specification, public Linux and NetBSD O2 framebuffer drivers, and shipped IRIX software readings"
public_from = ["published GBE 1.1 specification", "shipped IRIX"]

[words.CMAP_ENTRY]
width = 32
grade = "established"

[words.CMAP_ENTRY.fields]
r = { bits = [31, 24], grade = "established" }
g = { bits = [23, 16], grade = "established" }
b = { bits = [15, 8], grade = "established" }

[[words.CMAP_ENTRY.tests]]
value = 0xff804000
expect = { r = 255, g = 128, b = 64 }

[words.CMAP_FIFO]
width = 32
grade = "established"

[words.CMAP_FIFO.fields]
free = { bits = [5, 0], grade = "established" }

[words.CRS_CTL]
width = 32
grade = "established"
doc = "The shipped IRIX text port writes 1 after the glyph and colours are loaded; what the other bits mean there is unknown."

[words.CRS_CTL.fields]
enable = { bits = [0, 0], grade = "established" }
crosshair = { bits = [1, 1], grade = "established" }

[words.CRS_POS]
width = 32
grade = "established"
doc = """
Cursor position, CRS_0. The table gives 16-bit X in bits 15:0 and Y in bits 31:16,
reset zero. The spec's functional text (pp. 20-22) calls positions 12-bit, and NetBSD
treats the fields as signed. Width and signedness are unresolved. The shipped IRIX text port writes 0 at set-up."""

[words.CRS_POS.fields]
x = { bits = [15, 0], grade = "established" }
y = { bits = [31, 16], grade = "established" }

[words.CRS_START_XY]
width = 32
grade = "established"
doc = "The shipped IRIX kernel writes the same vertical part as DID_START_XY, with one line added (0x1000), and the horizontal blank end minus 54 with total pixels added when that is negative; the 54 is a kernel constant. The placement of the parts follows the fields here (inferred)."

[words.CRS_START_XY.fields]
starty = { bits = [23, 12], grade = "established" }
startx = { bits = [11, 0], grade = "established" }

[words.CTRLSTAT]
width = 32
grade = "established"
doc = """
Pin pair n is data at bit 6+2n and an active-low output enable at bit 7+2n, for
n = 0 to 9. Reset is 11 for every pair (data high, output disabled), so every pin
is an input. Bit 4 is the monitor sense pin, an external read-only input whose
polarity and wiring are not established. Bits 26 (half-phase) and 27 (composite
sync polarity) reset to zero. Bits 3:0 are the chip revision, read-only."""

[words.CTRLSTAT.fields]
monitor_sense = { bits = [4, 4], grade = "established" }
half_phase = { bits = [26, 26], grade = "established" }
csync_polarity = { bits = [27, 27], grade = "established" }
io9_oe_n = { bits = [25, 25], grade = "established" }
io9_data = { bits = [24, 24], grade = "established" }
io8_oe_n = { bits = [23, 23], grade = "established" }
io8_data = { bits = [22, 22], grade = "established" }
io7_oe_n = { bits = [21, 21], grade = "established" }
io7_data = { bits = [20, 20], grade = "established" }
io6_oe_n = { bits = [19, 19], grade = "established" }
io6_data = { bits = [18, 18], grade = "established" }
io5_oe_n = { bits = [17, 17], grade = "established" }
io5_data = { bits = [16, 16], grade = "established" }
io4_oe_n = { bits = [15, 15], grade = "established" }
io4_data = { bits = [14, 14], grade = "established" }
io3_oe_n = { bits = [13, 13], grade = "established" }
io3_data = { bits = [12, 12], grade = "established" }
io2_oe_n = { bits = [11, 11], grade = "established" }
io2_data = { bits = [10, 10], grade = "established" }
io1_oe_n = { bits = [9, 9], grade = "established" }
io1_data = { bits = [8, 8], grade = "established" }
io0_oe_n = { bits = [7, 7], grade = "established" }
io0_data = { bits = [6, 6], grade = "established" }
chip_rev = { bits = [3, 0], grade = "established" }

[words.CTRLSTAT.fields.pclk_select]
bits = [29, 28]
grade = "established"

[words.CTRLSTAT.fields.pclk_select.enums]
external = { value = 0, grade = "established" }
differential = { value = 1, grade = "established" }
internal = { value = 3, grade = "established" }

[[words.CTRLSTAT.tests]]
value = 0x30000000
expect = { pclk_select = 3, chip_rev = 0 }

[[words.CTRLSTAT.tests]]
value = 0x10000000
expect = { pclk_select = 1, chip_rev = 0 }

[words.DID_CONTROL]
width = 32
grade = "established"
doc = "The shipped IRIX stop routine tests the enable bit at entry, clears it and leaves the word otherwise unwritten; the kernel never writes the table address field."

[words.DID_CONTROL.fields]
dma_enable = { bits = [16, 16], grade = "established" }
did_base = { bits = [15, 0], grade = "established" }

[[words.DID_CONTROL.tests]]
value = 0x10005
expect = { did_base = 5, dma_enable = 1 }

[words.DID_FRAME]
width = 32
grade = "established"
doc = "The shipped IRIX X module packs a frame entry as block << 19 | offset << 11 | yend, one per horizontal band of lines."

[words.DID_FRAME.fields]
block = { bits = [25, 19], grade = "established" }
offset = { bits = [18, 11], grade = "established" }
yend = { bits = [10, 0], grade = "established" }

[words.DID_INHWCTRL]
width = 32
grade = "established"

[words.DID_INHWCTRL.fields]
dma_enable = { bits = [16, 16], grade = "established" }
did_base = { bits = [15, 0], grade = "established" }

[words.DID_LINE]
width = 32
grade = "established"
doc = "The shipped IRIX X module packs a line-table entry as index << 11 | xend, one per rectangle in a band and sorted by its last column, in 16-bit units inside a block."
notes = "The kernel reading treats a line-table entry as 16 bits wide; this word is declared 32 bits wide with the entry in the low 16. Whether the hardware fetches 16 or 32 bits is not established by either reading."

[words.DID_LINE.fields]
did = { bits = [15, 11], grade = "established" }
xend = { bits = [10, 0], grade = "established" }

[words.DID_START_XY]
width = 32
grade = "established"
doc = "The shipped IRIX kernel writes a vertical part of minus (vertical blank start minus vertical blank end minus 1) when that difference is positive, else the difference, masked to 12 bits, and a horizontal part of the horizontal blank end minus 20 (total pixels added when the blank end is below 20). The bit placement of the two parts is not stated by the kernel and follows the fields here."

[words.DID_START_XY.fields]
starty = { bits = [23, 12], grade = "established" }
startx = { bits = [11, 0], grade = "established" }

[words.DOTCLOCK]
width = 32
grade = "established"
doc = """
Bits 22 (out of range) and 23 (out of lock) are status bits. The table leaves their
reset contents unspecified, and the spec gives no PLL lock time or frequency limits.
Bits 25:24 are the PLL test inputs tdwni and tupi, described only as their normal
operation state, with reset zero ([gbe-spec] p. 36). The shipped IRIX kernel clears the run bit, writes the timing words, then writes this word with the run bit set and waits 11 milliseconds (DOTCLK_SETTLE_MS). It stores M minus one, N minus one and P unchanged. What the run bit does in the hardware is inferred; the specification leaves it undefined."""

[words.DOTCLOCK.fields]
out_of_lock = { bits = [23, 23], grade = "established" }
out_of_range = { bits = [22, 22], grade = "established" }
test = { bits = [25, 24], grade = "established" }
run = { bits = [20, 20], grade = "established" }
p = { bits = [15, 14], grade = "established" }
n_minus_1 = { bits = [13, 8], grade = "established" }
m_minus_1 = { bits = [7, 0], grade = "established" }

[[words.DOTCLOCK.tests]]
value = 0x100000
expect = { run = 1, p = 0 }

[words.FP_DE]
width = 32
grade = "established"
doc = "The shipped IRIX timing routine writes it only for the default set-up and panel set-ups 130 and 131, and only when no dual-channel option is fitted."

[words.FP_DE.fields]
on = { bits = [23, 12], grade = "established" }
off = { bits = [11, 0], grade = "established" }

[[words.FP_DE.tests]]
value = 0x303326
expect = { off = 806, on = 771 }

[words.FP_HDRV]
width = 32
doc = """
The three flat-panel drive registers and the three start-preset registers
share one layout: two 12-bit counts, "off" or "x" in the low half. The
specification names them VT_10 to VT_12 and VT_17 to VT_19 (pages 39 and
40). It compares FP_HDRV, FP_DE and the "x" halves with the horizontal
counter and FP_VDRV and the "y" halves with the vertical counter, but it
compares both halves of FP_DE with the horizontal counter. The totals
shipped software writes for two fixed panels (806 and 771, 1065 and 1024)
look like line counts, not pixel counts (inferred from magnitude); which
counter FP_DE really uses is unknown. The value the shipped IRIX timing routine writes depends on the board's panel set-up byte and on whether a dual-channel option is fitted."""
grade = "established"

[words.FP_HDRV.fields]
on = { bits = [23, 12], grade = "established" }
off = { bits = [11, 0], grade = "established" }

[[words.FP_HDRV.tests]]
value = 0xfff
expect = { off = 4095, on = 0 }

[words.FP_VDRV]
width = 32
grade = "established"
doc = "The value the shipped IRIX timing routine writes depends on the board's panel set-up byte and on whether a dual-channel option is fitted."

[words.FP_VDRV.fields]
on = { bits = [23, 12], grade = "established" }
off = { bits = [11, 0], grade = "established" }

[[words.FP_VDRV.tests]]
value = 0x1fff
expect = { off = 4095, on = 1 }

[words.FRM_CONTROL]
width = 32
grade = "established"
doc = "The shipped IRIX stop routine saves it, clears its enable bit, and later writes it back with its pointer field bumped by one unit."

[words.FRM_CONTROL.fields]
tile_list_ptr = { bits = [31, 5], grade = "established" }
dma_enable = { bits = [0, 0], grade = "established" }

[words.FRM_INHWCTRL]
width = 32
grade = "established"
doc = "The shipped IRIX start-up sequence polls bit 0 until it equals bit 0 of the value it has just written to the frame control word."

[words.FRM_INHWCTRL.fields]
dma_enable = { bits = [0, 0], grade = "established" }

[words.FRM_SIZE_PIXEL]
width = 32
grade = "established"
doc = "Frame height in pixels, shared by the normal and overlay planes. Reset zero."

[words.FRM_SIZE_PIXEL.fields]
height = { bits = [31, 16], grade = "established" }

[words.FRM_SIZE_TILE]
width = 32
grade = "established"

[words.FRM_SIZE_TILE.fields]
fifo_reset = { bits = [15, 15], grade = "established" }
width_tiles = { bits = [12, 5], grade = "established" }
remainder = { bits = [4, 0], grade = "established" }

[words.FRM_SIZE_TILE.fields.depth]
bits = [14, 13]
grade = "established"

[words.FRM_SIZE_TILE.fields.depth.enums]
bits8 = { value = 0, grade = "established" }
bits16 = { value = 1, grade = "established" }
bits32 = { value = 2, grade = "established" }

[words.I2C]
width = 32
grade = "established"
doc = """
Monitor DDC bus. Bit 0 is the data line and bit 1 the clock line; both reset to 1.
The spec gives separate output and synchronized input pins (page 22): a write sets
the outputs, and a read returns the bus state, which can differ from the output
latch. NetBSD XORs both written and read bits with 3 and calls the fields low
active. That is a software expectation (inferred), and the register table alone does
not say whether writing 1 releases a line. Whether the reset value 1 means released
is therefore not established."""

[words.I2C.fields]
sda = { bits = [0, 0], grade = "established" }
sdc = { bits = [1, 1], grade = "established" }

[words.I2CFP]
width = 32
grade = "established"
doc = """
Flat-panel DDC bus, same layout as I2C: data at bit 0 and clock at bit 1, both reset
to 1. The spec places external pullups on the flat-panel clock and data outputs
(page 4). The inverted-convention caveat under I2C applies here too."""

[words.I2CFP.fields]
sda = { bits = [0, 0], grade = "established" }
sdc = { bits = [1, 1], grade = "established" }

[words.MODE_ENTRY]
width = 32
grade = "established"
doc = "The shipped IRIX kernel rejects window indices of 32 or more and writes entry 0 with 3 at text-port set-up. Its compare mask (0x7fc) leaves the auxiliary field out, and it clears the gamma disable bit before a write when the alternative gamma table is in use. Buffer code: 3 buffers both, 0 marks the window to be skipped by the buffer flip, 1 and 2 exchange on a swap. Pixel type: 0 indexed 8-bit, 1 indexed 12-bit, 2 RG3B2, 4 RGB5, 5 RGB8. The colour-map group's first entry is the group value times 256."
notes = "The kernel reading called the fields aux, gamma_disable, map_group, type and buf for aux, gm, cm, typ and buf here, and graded its bit positions for aux, map_group, type and buf inferred from table values and the compare mask; the specification places all five established, so the positions here stand."

[words.MODE_ENTRY.fields]
aux = { bits = [12, 11], grade = "established" }
gm = { bits = [10, 10], grade = "established" }
cm = { bits = [9, 5], grade = "established" }

[words.MODE_ENTRY.fields.typ]
bits = [4, 2]
grade = "established"

[words.MODE_ENTRY.fields.typ.enums]
i8 = { value = 0, grade = "established" }
i12 = { value = 1, grade = "established" }
rg3b2 = { value = 2, grade = "established" }
rgb4 = { value = 3, grade = "established" }
rgb5 = { value = 4, grade = "established" }
rgb8 = { value = 5, grade = "established" }
rgba5 = { value = 6, grade = "established" }
rgb10 = { value = 7, grade = "established" }

[words.MODE_ENTRY.fields.buf]
bits = [1, 0]
grade = "established"

[words.MODE_ENTRY.fields.buf.enums]
lower = { value = 1, grade = "established" }
upper = { value = 2, grade = "established" }
both = { value = 3, grade = "established" }

[[words.MODE_ENTRY.tests]]
value = 0x41
expect = { buf = 1, typ = 0, cm = 2 }

[words.OVR_CONTROL]
width = 32
grade = "established"
doc = "The shipped IRIX stop routine clears its enable bit and leaves the word otherwise unwritten; reading the enable as a DMA enable is inferred."

[words.OVR_CONTROL.fields]
tile_list_ptr = { bits = [31, 5], grade = "established" }
dma_enable = { bits = [0, 0], grade = "established" }

[words.OVR_INHWCTRL]
width = 32
grade = "established"
doc = "The shipped IRIX start-up sequence polls bit 0 until it equals bit 0 of the value it has just written to the overlay control word."

[words.OVR_INHWCTRL.fields]
dma_enable = { bits = [0, 0], grade = "established" }

[words.OVR_WIDTH_TILE]
width = 32
grade = "established"
doc = "Overlay width must be a multiple of 32 pixels, so the 32-byte remainder is whole pixels at 8 bits (GBE 1.1 pp. 13-14)."

[words.OVR_WIDTH_TILE.fields]
fifo_reset = { bits = [13, 13], grade = "established" }
width_tiles = { bits = [12, 5], grade = "established" }
remainder = { bits = [4, 0], grade = "established" }

[words.SYSCLK]
width = 32
grade = "established"
doc = """
System PLL test controls, gains and divider ([gbe-spec] p. 37). Bits 1:0 are tdwni and
tupi and bits 3:2 tm(1) and tm(0), described as normal operation states; the field
below spans all four. Reset has bit 3 set and every other defined bit zero."""

[words.SYSCLK.fields]
tm = { bits = [3, 0], grade = "established" }
voltage_gain = { bits = [9, 8], grade = "established" }
current_gain = { bits = [11, 10], grade = "established" }
divider = { bits = [14, 12], grade = "established" }

[[words.SYSCLK.tests]]
value = 0x8
expect = { tm = 8 }

[words.TILE_LIST_ENTRY]
width = 32
grade = "established"

[words.TILE_LIST_ENTRY.fields]
tile = { bits = [12, 0], grade = "established" }

[words.VC_0]
width = 32
grade = "established"

[words.VC_0.fields]
right = { bits = [23, 12], grade = "established" }
left = { bits = [11, 0], grade = "established" }

[words.VC_1]
width = 32
grade = "established"

[words.VC_1.fields]
bottom = { bits = [23, 12], grade = "established" }
top = { bits = [11, 0], grade = "established" }

[words.VC_2]
width = 32
grade = "established"
doc = "The shipped IRIX video driver clears VC_0 to VC_3 (written as zero when a capture path stops); bit 0 of VC_2 enabling DMA is inferred from its start routine."

[words.VC_2.fields]
cs_bypass = { bits = [4, 4], grade = "established" }
full_screen = { bits = [3, 3], grade = "established" }
auto_field = { bits = [2, 2], grade = "established" }
flicker_filter = { bits = [1, 1], grade = "established" }
dma_enable = { bits = [0, 0], grade = "established" }

[words.VC_3]
width = 32
grade = "established"
doc = "The shipped IRIX video driver clears it when a capture path stops and holds a path byte in it; that reading is inferred from the start routine."

[words.VC_3.fields]
descr_ptr = { bits = [31, 5], grade = "established" }
current_field = { bits = [4, 4], grade = "established" }
end_of_field = { bits = [3, 3], grade = "established" }
field_corrupt = { bits = [2, 2], grade = "established" }
descr_dma_enable = { bits = [1, 1], grade = "established" }
field_select = { bits = [0, 0], grade = "established" }

[words.VC_START_XY]
width = 32
grade = "established"
doc = "The shipped IRIX kernel writes the same vertical part as DID_START_XY without the extra line, and the horizontal blank end minus 4. The placement of the parts follows the fields here (inferred)."

[words.VC_START_XY.fields]
starty = { bits = [23, 12], grade = "established" }
startx = { bits = [11, 0], grade = "established" }

[words.VC_TILES]
width = 32
grade = "established"

[words.VC_TILES.fields]
tile_first = { bits = [31, 16], grade = "established" }
tile_second = { bits = [15, 0], grade = "established" }

[words.VT_F2RF_LOCK]
width = 32
grade = "established"
doc = """
Field-to-frame lock line, VT_7. The register table ([gbe-spec] p. 39) puts vt_f2rf, the
line where the left/right synchronisation signal toggles, in bits 11:0 and vt_frmlock, the
line vt_y is preset to on a frame-lock edge, in bits 23:12, and gives both a reset of zero. The shipped IRIX timing routine stores the vertical blank start line in the high field, and repeats it in the low field when the frame-lock flag bits (mask 0x12) of its timing record are set, else 0xfff."""
notes = "The kernel reading called the fields blank_start and low and the word VT_7; the word's use as a frame-lock position is the specification's. The two readings put the same value in the high field. Names kept as the specification gives them."

[words.VT_F2RF_LOCK.fields]
stereo_toggle_y = { bits = [11, 0], grade = "established" }
frame_lock_y = { bits = [23, 12], grade = "established" }

[words.VT_HBLANK]
width = 32
grade = "established"
doc = "Horizontal blanking turns off and on at these pixel counts (VT_5). The shipped IRIX timing routine stores it in the interlace case and when no dual-channel option is fitted, packing the active width in the high field and 0xfff in the low field."

[words.VT_HBLANK.fields]
off = { bits = [11, 0], grade = "established" }
on = { bits = [23, 12], grade = "established" }

[words.VT_HPIXEN]
width = 32
grade = "established"
doc = """
Horizontal pixel-enable window, VT_13. The spec prose says the horizontal and vertical
enables combine with OR. The table does not settle that rule. The shipped IRIX kernel parks 0xffffff here before the frame buffer is set up and writes it last in the start-up sequence: the high field is the horizontal blank end minus 0x13 (total pixels added first when that is negative), the low field is (active width + that value - 2) modulo total pixels."""

[words.VT_HPIXEN.fields]
off = { bits = [11, 0], grade = "established" }
on = { bits = [23, 12], grade = "established" }

[words.VT_HSYNC]
width = 32
grade = "established"
doc = "Horizontal sync turns off and on at these pixel counts (VT_3)."

[words.VT_HSYNC.fields]
off = { bits = [11, 0], grade = "established" }
on = { bits = [23, 12], grade = "established" }

[words.VT_VBLANK]
width = 32
grade = "established"
doc = "Vertical blanking turns off and on at these lines (VT_4). The shipped IRIX timing routine stores it in the interlace case and when no dual-channel option is fitted, packing the active height in the high field and 0xfff in the low field."

[words.VT_VBLANK.fields]
off = { bits = [11, 0], grade = "established" }
on = { bits = [23, 12], grade = "established" }

[words.VT_VPIXEN]
width = 32
grade = "established"
doc = "Vertical pixel-enable window, VT_14. The shipped IRIX kernel parks 0xffffff here and writes it last in the start-up sequence with the vertical blank end in the high field and the vertical blank start in the low field."

[words.VT_VPIXEN.fields]
off = { bits = [11, 0], grade = "established" }
on = { bits = [23, 12], grade = "established" }

[words.VT_VSYNC]
width = 32
grade = "established"
doc = """
Vertical sync turns off and on at these lines (VT_2). The page 38 text for the on
row repeats the off comparator, so the positions are established but that description
is not."""

[words.VT_VSYNC.fields]
off = { bits = [11, 0], grade = "established" }
on = { bits = [23, 12], grade = "established" }

[words.VT_FLAGS]
width = 32
grade = "established"
doc = """
Output polarity and control bits 6:0 (VT_6). The register table ([gbe-spec] p. 39) names
every bit and gives all of them a reset of zero: vsync invert, vsync forced low, hsync
invert, hsync forced low, composite sync forced high (4) or low (5), and left/right
signal forced high (6). The shipped IRIX timing routine reads it, clears bits 1 and 7, and ORs in 0 or 2 for the board's panel set-up byte 132. What bit 1 does to the hardware is unknown. The value is undefined when the option lookup that feeds it fails."""

[words.VT_FLAGS.fields]
sync_low = { bits = [5, 5], grade = "established" }
vertical_invert = { bits = [0, 0], grade = "established" }
vertical_forced_low = { bits = [1, 1], grade = "established" }
horizontal_invert = { bits = [2, 2], grade = "established" }
horizontal_forced_low = { bits = [3, 3], grade = "established" }
composite_sync_high = { bits = [4, 4], grade = "established" }
stereo_forced_high = { bits = [6, 6], grade = "established" }

[words.VT_HCMAP]
width = 32
grade = "established"
doc = "The shipped IRIX kernel writes the horizontal blank window: start in the high field, end in the low field, in pixels."

[words.VT_HCMAP.fields]
on = { bits = [23, 12], grade = "established" }
off = { bits = [11, 0], grade = "established" }

[words.VT_INTR01]
width = 32
grade = "established"

[words.VT_INTR01.fields]
line0 = { bits = [23, 12], grade = "established" }
line1 = { bits = [11, 0], grade = "established" }

[words.VT_INTR23]
width = 32
grade = "established"

[words.VT_INTR23.fields]
line2 = { bits = [23, 12], grade = "established" }
line3 = { bits = [11, 0], grade = "established" }

[words.VT_VCMAP]
width = 32
grade = "established"
doc = "The shipped IRIX kernel writes the vertical blank window: start in the high field, end in the low field, in lines."

[words.VT_VCMAP.fields]
on = { bits = [23, 12], grade = "established" }
off = { bits = [11, 0], grade = "established" }

[words.VT_XY]
width = 32
grade = "established"
doc = "The shipped IRIX start-up sequence compares its whole unmasked value with the vertical blank start line; the stop sequence reads bit 31 as the freeze state and freezes the word by writing VT_XY_FREEZE. The kernel reading derived this offset from the numbering of the other timing words and graded it inferred; the specification's table gives it."

[words.VT_XY.fields]
x = { bits = [11, 0], grade = "established" }
y = { bits = [23, 12], grade = "established" }
freeze = { bits = [31, 31], grade = "established" }

[words.VT_XYMAX]
width = 32
grade = "established"
doc = "The shipped IRIX timing routine writes 0 here, and the start-up sequence writes the totals once the frame buffer is set up. The kernel stores the record's total pixels and total lines, not one less than them; whether the hardware expects one less is unknown."

[words.VT_XYMAX.fields]
vtotal = { bits = [23, 12], grade = "established" }
htotal = { bits = [11, 0], grade = "established" }

[[words.VT_XYMAX.tests]]
value = 0x20d320
expect = { htotal = 800, vtotal = 525 }

[constants]
CMAP_ENTRIES_REV1 = { value = 0x1200, grade = "established", doc = "revision 1.1" }
