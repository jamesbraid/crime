# Hardware definitions. Edit this file; generated/ is generated from it.
unit = "mace_serial_dma"
prefix = "MACE_SERIAL_DMA"
title = "O2 MACE serial port DMA channels: channel control, ring pointers and depth"
doc = "MACE serial DMA block for one serial port: the transmit and receive channel control, read and write pointers and depth. Offsets are from the port block base (constant BLOCK_BASE for port 1, PORT2_BLOCK_BASE for port 2; the two blocks use the same offsets). Index 0 of each register is the transmit channel and index 1 is the receive channel. The ring interrupt causes are in mace_periph.toml, and the packet formats and ring placement are in devices/mace_serial_dma/mace-serial-dma.md."
from = "published MACE 2.0 I/O ASIC specification: register tables (printed pages 122 and 127), serial ring buffer registers and ring placement (printed pages 127 and 128), packet formats (printed pages 129 and 130)"
public_from = ["published MACE 2.0 I/O ASIC specification"]

[enums.serial_threshold]
doc = "Interrupt threshold of a serial DMA channel. The levels are block counts of the 4 KiB ring, 128 blocks in all. For an input channel the first three values mean at least one quarter, one half and three quarters full. For an output channel they mean below those levels (established, printed page 127)."

[enums.serial_threshold.values]
off = { value = 0, grade = "established", doc = "Interrupt disabled; the output stays inactive." }
depth_quarter = { value = 1, grade = "established" }
depth_half = { value = 2, grade = "established" }
depth_three_quarter = { value = 3, grade = "established" }
empty = { value = 4, grade = "established" }
not_empty = { value = 5, grade = "established" }
full = { value = 6, grade = "established" }
not_full = { value = 7, grade = "established" }

[enums.serial_ring]
doc = "Ring ID in bits 2:0 of a serial ring address (established, printed page 128, table 60). The ring ID selects a 4 KiB ring within the 32 KiB ring block set by the peripheral ring base."

[enums.serial_ring.values]
scratch = { value = 3, grade = "established", doc = "Scratch area, free for software." }
port1_tx = { value = 4, grade = "established" }
port1_rx = { value = 5, grade = "established" }
port2_tx = { value = 6, grade = "established" }
port2_rx = { value = 7, grade = "established" }

[constants]
BLOCK_BASE = { value = 0x1f318000, grade = "established", doc = "physical base of the serial port 1 DMA register block, page 2 of the 16 KiB ISA register pages (printed page 122, table 52)" }
PORT2_BLOCK_BASE = { value = 0x1f31c000, grade = "established", doc = "physical base of the serial port 2 DMA register block, page 3 of the 16 KiB ISA register pages (printed page 122, table 52)" }
RING_BYTES = { value = 0x1000, grade = "established", doc = "size of each serial DMA ring, 4 KiB (printed pages 123 and 128)" }
RING_BASE_ALIGN = { value = 0x8000, grade = "established", doc = "alignment of the ring block base, which the peripheral ring base register supplies in bits 31:15 (printed pages 123 and 128)" }

[registers.channel_control]
offset = 0x0
access = "rw"
width = 64
count = 2
stride = 0x20
grade = "established"
reset = 0x400
reset_from = "MACE 2.0 I/O ASIC specification, Table 58"
doc = """
Control of the transmit channel (index 0, offset 0x00) and the receive channel (index 1, offset 0x20). Bits not listed read zero and ignore writes (established, printed page 127, table 58). Both channels share this layout."""

[registers.channel_control.fields]
channel_reset = { bits = [10, 10], grade = "established", doc = "1 resets the channel: it goes inactive, all of its registers reset, the interrupt output goes inactive and the FIFOs are flushed. Resets to 1 (printed page 127). This is separate from the external controller reset in the peripheral ring base (see mace_periph.toml)." }
dma_enable = { bits = [9, 9], grade = "established", doc = "1 enables the channel and it must have its pointers set up first. 0 freezes the channel and leaves its state unchanged (printed page 127)." }
threshold = { bits = [7, 5], grade = "established", enum = "serial_threshold", doc = "Interrupt condition, see the serial_threshold enum (printed page 127)." }

[registers.channel_read]
offset = 0x8
access = "rw"
width = 64
count = 2
stride = 0x20
grade = "established"
reset = 0x0
reset_from = "MACE 2.0 I/O ASIC specification, Table 56"
doc = """
Read pointer of each channel, in 32-byte blocks. On the transmit channel the DMA engine owns it, and on the receive channel software owns it (established for the ownership text, printed page 128). The printed register tables mark both pointers read/write (printed pages 122 and 127), so whether a software write to the engine-owned pointer is ignored is unknown."""

[registers.channel_read.fields]
block_index = { bits = [11, 5], grade = "established", doc = "Position in 32-byte blocks within the 4 KiB ring. Bits 4:0 and 15:12 read zero (printed page 127, table 56). Page 122 gives this pointer bits 11:0, which conflicts with page 127; the page 127 field is used here." }

[registers.channel_write]
offset = 0x10
access = "rw"
width = 64
count = 2
stride = 0x20
grade = "established"
reset = 0x0
reset_from = "MACE 2.0 I/O ASIC specification, Table 57"
doc = """
Write pointer of each channel, in 32-byte blocks. On the transmit channel software owns it, and on the receive channel the DMA engine owns it (established for the ownership text, printed page 128). The same table conflict as channel_read applies, so a software write to the engine-owned pointer is unknown."""

[registers.channel_write.fields]
block_index = { bits = [11, 5], grade = "established", doc = "Position in 32-byte blocks within the 4 KiB ring. Bits 4:0 and 15:12 read zero (printed page 127, table 57). Page 122 gives bits 11:0, as for channel_read." }

[registers.channel_depth]
offset = 0x18
access = "r"
width = 64
count = 2
stride = 0x20
grade = "established"
reset = 0x0
reset_from = "MACE 2.0 I/O ASIC specification, Table 59"
doc = """
Blocks of ring data in use, computed as the write pointer minus the read pointer. Zero is empty and 127 is full (established, printed page 127, table 59). Page 128 says equal pointers mean the ring is full on an input channel and empty on an output channel, which conflicts with the depth-zero reading. See devices/mace_serial_dma/mace-serial-dma.md."""

[registers.channel_depth.fields]
blocks = { bits = [11, 5], grade = "established", doc = "Number of 32-byte blocks in the ring. Bits 4:0 and 15:12 read zero." }
