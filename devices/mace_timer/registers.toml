# Hardware definitions. Edit this file; generated/ is generated from it.
unit = "mace_timer"
prefix = "MACE_TIMER"
title = "O2 MACE free-running counter, three compare registers and audio and video time stamps"
doc = "MACE timer block: the 32-bit counter, the three 32-bit compare registers that set level interrupts, and the audio and video UST/MSC pairs. Offsets are from the block base (constant BLOCK_BASE)."
from = "published MACE 2.0 I/O ASIC specification (printed pages 63, 147 and 148) and the public Linux mace_timers layout"
public_from = ["published MACE 2.0 I/O ASIC specification", "shipped IRIX"]

[registers.counter]
offset = 0x0
access = "rw"
width = 64
grade = "established"
reset = 0x0
doc = """
One 32-bit counter, clocked every 960 ns (the 33.333 MHz PCI clock divided by 32). It starts at zero on power-on reset and wraps in 32 bits (established, printed page 147). The prose calls it read-only while the register table labels it read/write (printed page 148); the access is open (see docs/open-questions.md)."""

[registers.counter.fields]
count = { bits = [31, 0], grade = "established" }

[registers.cmp0]
offset = 0x8
access = "rw"
width = 64
grade = "established"
doc = """
32-bit compare. Equality sets level interrupt latch 0, which drives peripheral status bit 13. Writing the register clears the latch, and the latch resets low. The reset value of the compare is not stated (established, printed page 147)."""

[registers.cmp0.fields]
value = { bits = [31, 0], grade = "established" }

[registers.cmp1]
offset = 0x10
access = "rw"
width = 64
grade = "established"
doc = """
32-bit compare. Equality sets level interrupt latch 1, which drives peripheral status bit 14. Writing clears the latch. Reset value not stated (established, printed page 147)."""

[registers.cmp1.fields]
value = { bits = [31, 0], grade = "established" }

[registers.cmp2]
offset = 0x18
access = "rw"
width = 64
grade = "established"
doc = """
32-bit compare. Equality sets level interrupt latch 2, which drives peripheral status bit 15. Writing clears the latch. Reset value not stated (established, printed page 147)."""

[registers.cmp2.fields]
value = { bits = [31, 0], grade = "established" }

[registers.audio_pair]
offset = 0x20
access = "rw"
width = 64
count = 3
stride = 0x8
grade = "established"
doc = """
Audio time stamp pairs: capture at 0x20, playback 1 at 0x28 and playback 2 at 0x30. A 64-bit read of a pair returns UST in bits 63:32 and MSC in bits 31:0. UST is the 960 ns counter at the last counted sample, and MSC is the sample pair count. MSC is writable so software can clear it (established, printed page 63 and the table on printed page 147). Section 7.2.1 of the same chapter swaps the two offsets in its prose; the table and the figure on page 63 agree with this layout."""

[registers.audio_pair.fields]
ust = { bits = [63, 32], grade = "established" }
msc = { bits = [31, 0], grade = "established" }

[registers.video_pair]
offset = 0x38
access = "rw"
width = 64
count = 3
stride = 0x8
grade = "established"
doc = """
Video time stamp pairs: input channel 1 at 0x38, input channel 2 at 0x40 and the output channel at 0x48 (printed page 148, table 75; printed page 56 for the layout). A 64-bit aligned read returns UST in bits 63:32 and the field count in bits 31:0, which holds the frame count in bits 31:1 and the field ID in bit 0, zero for odd and one for even (established, printed page 56, table 25). UST is the 960 ns counter captured at field start. The count advances at field end while a video signal is active. DMA enable does not clock it, and software can write it (established, printed page 56). The timer chapter's table on printed page 148 names UST at the pair base and MSC at base plus four, the reverse of this bit layout; the chapter's atomic-read rule on the same page agrees with the layout here. Whether 32-bit accesses to each half reach UST or MSC, and how a partial access behaves, is not published. The shipped IRIX video driver reads a timestamp snapshot doubleword per channel from the timer block: input channel 1 at offset 0x38, input channel 2 at 0x40 and the output channel at 0x48 (TIMER_SNAP_IN1_OFF, TIMER_SNAP_IN2_OFF, TIMER_SNAP_OUT_OFF)."""

[registers.video_pair.fields]
ust = { bits = [63, 32], grade = "established" }
frame_count = { bits = [31, 1], grade = "established" }
field_id = { bits = [0, 0], grade = "established", doc = "Zero for odd, one for even (printed page 56, table 25)." }

[constants]
BLOCK_BASE = { value = 0x1f340000, grade = "established", doc = "physical base of the timer block (printed page 147)" }
CMP0_ALIAS = { value = 0x1f350000, grade = "established", doc = "alias of the compare register at offset 0x8, which the address map numbers #1 (printed page 181)" }
CMP1_ALIAS = { value = 0x1f360000, grade = "established", doc = "alias of the compare register at offset 0x10, numbered #2 (printed page 181)" }
CMP2_ALIAS = { value = 0x1f370000, grade = "established", doc = "alias of the compare register at offset 0x18, numbered #3 (printed page 181)" }
TIMER_SNAP_IN1_OFF = { value = 0x38, grade = "established", from = "shipped IRIX O2 video driver object, per kudzu docs/mace-video.md", doc = "Timer snapshot doubleword for input channel 1, from the timer block base." }
TIMER_SNAP_IN2_OFF = { value = 0x40, grade = "established", from = "shipped IRIX O2 video driver object, per kudzu docs/mace-video.md", doc = "Timer snapshot doubleword for input channel 2, from the timer block base." }
TIMER_SNAP_OUT_OFF = { value = 0x48, grade = "established", from = "shipped IRIX O2 video driver object, per kudzu docs/mace-video.md", doc = "Timer snapshot doubleword for the output channel, from the timer block base." }
