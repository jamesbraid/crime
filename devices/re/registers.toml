START_ALIAS_BIT = { value = 0xb, grade = "established", doc = "address bit that selects the start alias of a register" }
TLB_ENTRIES_PER_REG = { value = 0x4, grade = "established", doc = "four 16-bit tile entries in each frame-buffer, texture and clip-ID doubleword" }
TLB_TILE_SHIFT = { value = 0x10, grade = "established", doc = "entry is the physical address >> 16 (64 KiB tiles)" }
LINEAR_WINDOW_MASK = { value = 0x1ffff, grade = "established", from = "shipped IRIX O2 graphics objects, per kudzu docs/crime.md", doc = "Mask on the linear source address of a draw; the linear window is 128 KiB." }
