# Hardware definitions. Edit this file; generated/ is generated from it.
unit = "crime"
prefix = "CRIME"
title = "O2 CRIME memory controller and CPU interface registers"
doc = "CRIME memory controller and CPU-interface registers, and the interrupt input bit positions."
from = "published CRIME 1.5 draft specification (rev 0.3), public Linux and NetBSD O2 drivers, and shipped IRIX software readings"
public_from = ["published CRIME 1.5 draft specification", "shipped IRIX"]

[registers.id]
offset = 0x0
access = "r"
width = 64
grade = "established"
doc = """
The CPU interface registers, 0x14000000 to 0x14004048, take double-word accesses only (established, [spec] PDF 113). The same page asks, with a question mark, whether the memory control and rendering addresses follow that rule too. PDF 149 settles the memory-control block (see mem_bank_control); the rendering addresses stay unknown. Table 5-8 gives the 1.5 reset value as 0xb1, and its note gives the CRIME 1.1 ID as 0xa1 (established, [spec] PDF 114). The graphics probe in the shipped IRIX kernel reads the low byte and accepts the part only when bits 7:4 are the family 0xa and the byte is not 0xa0."""

[registers.id.fields]
family = { bits = [7, 4], grade = "established" }
rev = { bits = [3, 0], grade = "established" }

[[registers.id.tests]]
value = 0xa1
expect = { family = 10, rev = 1 }

[registers.control]
offset = 0x8
access = "rw"
width = 64
grade = "established"
reset = 0x0
doc = "The shipped IRIX early-reset code writes bits 13:12 and 9 of it."

[registers.control.fields]
sysadc_gen_enable = { bits = [13, 13], grade = "established" }
sysadc_check_enable = { bits = [12, 12], grade = "established" }
cold_reset = { bits = [11, 11], grade = "established" }
soft_reset = { bits = [10, 10], grade = "established" }
watchdog_enable = { bits = [9, 9], grade = "established" }
endian = { bits = [8, 8], grade = "established" }

[[registers.control.tests]]
value = 0x2200
expect = { sysadc_gen_enable = 1, sysadc_check_enable = 0, watchdog_enable = 1 }

[registers.intstat]
offset = 0x10
access = "r"
width = 64
grade = "established"
doc = """
Read-only (established, [spec] Table 5-10, PDF 116). Each bit is the OR of the matching bit of the hardware interrupt register and of the software interrupt register (established, [spec] PDF 106). The shipped IRIX dispatcher reads its low 32 bits ANDed with the saved mask."""

[registers.intmask]
offset = 0x18
access = "rw"
width = 64
grade = "established"
reset = 0x0
doc = """
A status bit reaches the processor only when the same bit here is set. The status register is ANDed with this one, bit for bit, to make the interrupts (established, [spec] PDF 106 and PDF 233). Table 5-11 (PDF 117) gives bits 31:0 as read/write, 1 enabling, reset zero. It has no row for bits 63:32, so their effect on the hardware is unknown. The shipped IRIX entry path saves it and installs a per-priority mask."""

[registers.intmask.fields]
enable = { bits = [31, 0], grade = "established" }

[registers.softint]
offset = 0x20
access = "rw"
width = 64
grade = "established"
reset = 0x0
doc = "The shipped IRIX kernel's two software interrupts are inputs 28 and 29; that this word raises them is inferred from the kernel's software-interrupt use and the public NetBSD names."

[registers.hardint]
offset = 0x28
access = "rw"
width = 64
grade = "established"
doc = """
Table 5-13 (PDF 117 to 118) marks these bits edge-sensitive: 30 (CPU SysCorErr), 24 to 22 (rendering idle, full and empty) and 19 to 16 (GBE). It marks 27 to 25 (rendering idle, full and empty levels) level-sensitive. The table leaves the other status bits unlabelled (established). The shipped IRIX retrace and pre-blank handlers acknowledge by clearing bit 16 or 17 of this word with a read-modify-write."""
notes = "The kernel reading calls this word the interrupt edge word; the public names call it the hard interrupt word. Same offset and use, kept under the owner's name."

[registers.watchdog]
offset = 0x30
access = "rw"
width = 64
grade = "established"
reset = 0x0
doc = "The shipped IRIX kernel writes zero at start-up and never arms it."

[registers.watchdog.fields]
warm_reset_timeout = { bits = [20, 20], grade = "established" }
count = { bits = [19, 0], grade = "established" }

[registers.timer]
offset = 0x38
access = "rw"
width = 64
grade = "established"
reset = 0x0
doc = """
Free-running counter. The specification defines bits 31:0 as read/write with reset zero and gives no field above bit 31 (established, [spec] PDF 113 places it at offset 0x38 and Table 5-15 on PDF 119 defines the low 32 bits). The same page gives a nominal rate of about 66.7 MHz (established as spec prose; not an oscillator measurement). NetBSD's crime header masks 48 bits, so the width above bit 31 is open (see questions/README.md). The low word would sit at offset 0x3c under big-endian addressing, and IRIX's query_cyclecntr returns 0xb400003c as the address of the counter's low word (software expectation, so inferred; software/kernel/functions.md). Whether a four-byte read there returns the same count is unknown. The CPU-interface rule allows doubleword accesses only (established, [spec] PDF 113), and Table 5-1 (printed page 5-5, PDF 93) lists single and partial-word processor requests without saying whether they reach these registers (see questions/README.md). The shipped IRIX kernel reads its low word. It states the resolution as 15000, whose unit is inferred to be picoseconds (a 66.67 MHz tick); see TIME_RESOLUTION."""

[registers.timer.fields]
count = { bits = [31, 0], grade = "established" }

[registers.cpu_error_addr]
offset = 0x40
access = "r"
width = 64
grade = "established"
doc = """
Records address bits 33:2 of a failed CPU programmed-I/O access, in the low 32 bits (established, [spec] Table 5-16, PDF 120). The spec records it for a SysAD parity error or an invalid address. Whether clearing the status also clears this register or the interrupt cause is unknown. The spec says software would like bits 39:34 captured as well (established, [spec] PDF 233); see the status register."""

[registers.cpu_error_addr.fields]
addr_33_2 = { bits = [31, 0], grade = "established" }

[registers.cpu_error_stat]
offset = 0x48
access = "rw"
width = 64
grade = "established"
reset = 0x0
doc = """
Set by hardware, cleared by software (established, [spec] Table 5-17, PDF 120). This is the CRIME 1.1 offset; the 1.5 specification gives the register's address as 0x14004048 (see cpu_error_stat_15). Bits 1 and 0 are no longer supported on 1.5 because SysADC is not used (established, PDF 120). Bits 8:3 hold address bits 39:34 on 1.5 "if it can be implemented"; whether fitted parts do is unknown. The spec does not define "invalid address", so whether a refused CPU access sets bit 2 is unknown. The shipped IRIX capture routine clears it by writing zero."""

[registers.cpu_error_stat.fields]
addr_39_34 = { bits = [8, 3], grade = "unknown" }
illegal_addr = { bits = [2, 2], grade = "established" }
vice_write_parity = { bits = [1, 1], grade = "established" }
cpu_write_parity = { bits = [0, 0], grade = "established" }

[[registers.cpu_error_stat.tests]]
value = 0x4
expect = { illegal_addr = 1, cpu_write_parity = 0 }

[registers.cpu_error_ena]
offset = 0x50
access = "rw"
width = 64
grade = "inferred"
doc = """
The CRIME 1.5 CPU interface register map has no row for this offset. It lists the CPU error address and the CPU error status (cpu_error_stat_15) and nothing in between (established, [spec] Table 5-7, PDF 113). The name CRIME_CPU_ERROR_ENA and this offset come from NetBSD's public crime header, which places it after the CPU error status. The driver in that tree does not program the name (software expectation, inferred). Linux's public O2 crime header leaves the same slot as padding after the status (software expectation, inferred). Reset value, field layout and readback are unknown from any published source; the revision-0 enable word that IRIX writes is described in devices/re/memory.md."""

[registers.vice_error_addr]
offset = 0x58
access = "r"
width = 64
grade = "established"

[registers.mem_control]
offset = 0x200
access = "rw"
width = 64
grade = "established"
reset = 0x0
doc = """
Memory control. Both defined bits reset clear (established, [spec] PDF 150). The specification pages examined do not define the read value or write effect of bits above bit 1 (unknown, [spec] PDF 149 to 150). The shipped IRIX kernel writes 1 to enable and 0 to disable, and never writes the bank or refresh registers."""

[registers.mem_control.fields]
use_repl_check = { bits = [1, 1], grade = "established", doc = "1 makes the controller write the replacement check byte in mem_error_ecc_repl as the check bits, instead of generated check bits. Resets to 0 (established, [spec] PDF 150)." }
ecc_enable = { bits = [0, 0], grade = "established", doc = "1 enables memory ECC. Resets to 0 (established, [spec] PDF 150)." }

[registers.mem_bank_control]
offset = 0x208
access = "rw"
width = 64
grade = "established"
count = 8
doc = """
Bits 7:5 are reserved and read as zero (established, [spec] PDF 152, table 6-14, CRIME 1.5 specification rev 0.3). Bit 8 resets clear (established, [spec] PDF 152, table 6-14). The memory-controller registers, from 0x14000200 up, take double-word operations only (established, [spec] PDF 149, section 6.2.7)."""

[registers.mem_bank_control.fields]
sdram_geometry = { bits = [8, 8], grade = "established" }
base_match = { bits = [4, 0], grade = "established" }

[registers.mem_error_stat]
offset = 0x250
access = "rw"
width = 64
grade = "established"
doc = """
Reset values differ per bank, so the REG line's reset=unknown stands for none of them: bank n resets to n for n = 0 to 7
(established, [spec] table 6-14; no shipped software writes banks 2 to 7). With 32 MiB parts that puts bank n at n * 32 MiB.
#define CRIME_MEM_BANK_CONTROL_RESET_BASE 0 /* established: reset of bank 0
#define CRIME_MEM_BANK_CONTROL_RESET_STEP 1 /* established: reset of bank n is BASE + n * STEP

The shipped IRIX kernel's `badaddr` stores zero here before a probe and afterwards tests hardware interrupt status bits 21 and 20 (mask 0x300080, with MACE line 7) for an error (software expectation, inferred; see devices/re/memory.md). Whether a zero write clears the latch on the part is unknown: the specification says only that the bits are set by hardware, cleared by software and read/write ([spec] PDF 152 to 153, table 6-16), without a clear polarity. The shipped IRIX capture routine clears it by writing zero."""

[registers.mem_error_stat.fields]
invalid_addr_rmw = { bits = [27, 27], grade = "established" }
invalid_addr_write = { bits = [26, 26], grade = "established" }
invalid_addr_read = { bits = [25, 25], grade = "established" }
ecc_error_rmw = { bits = [24, 24], grade = "established" }
ecc_error_read = { bits = [23, 23], grade = "established" }
multiple_errors = { bits = [22, 22], grade = "established" }
hard_error = { bits = [21, 21], grade = "established" }
soft_error = { bits = [20, 20], grade = "established" }
cpu_access = { bits = [18, 18], grade = "established" }
vice_access = { bits = [17, 17], grade = "established" }
gbe_access = { bits = [16, 16], grade = "established" }
re_access = { bits = [15, 15], grade = "established" }
re_id = { bits = [14, 8], grade = "established" }
mace_access = { bits = [7, 7], grade = "established" }
mace_id = { bits = [6, 0], grade = "established" }

[registers.mem_error_addr]
offset = 0x258
access = "r"
width = 64
grade = "established"

[registers.mem_error_ecc_syn]
offset = 0x260
access = "r"
width = 64
grade = "established"

[registers.mem_error_ecc_chk]
offset = 0x268
access = "r"
width = 64
grade = "established"

[registers.mem_error_ecc_repl]
offset = 0x270
access = "rw"
width = 64
grade = "established"
reset = 0x0
doc = """
The published table defines only bits 7:0 and gives reset zero (established, [spec] Table 6-20, PDF 155). When bit 1 of mem_control is set, the controller writes this low byte repeated across the four check bytes of a 256-bit memory word (established, [spec] PDF 155). The full-width mask 0xffffffff in Linux's public crime header does not establish 32 independent replacement bits; it conflicts with that table (software expectation, inferred). Readback of bits 63:8 is unspecified (unknown)."""

[registers.mem_error_ecc_repl.fields]
check = { bits = [7, 0], grade = "established" }

[registers.cpu_error_stat_15]
offset = 0x4048
access = "rw"
width = 64
grade = "inferred"
reset = 0x0
doc = """
The CRIME 1.5 specification places the CPU error status register here, on its own 16 KiB page so that it can be mapped to user programs (established, [spec] Table 5-7 and its note, PDF 113). Bit layout as in Table 5-17 (PDF 120). The grade stays inferred: whether a fitted part implements this offset is not established."""

[words.INTBIT]
width = 32
grade = "established"
doc = """
Interrupt status bit positions, from the CRIME 1.5 specification's Table 5-5 (PDF 106 to 108; established). Each bit is ORed with others onto one R10000 interrupt line, IP2 to IP6, given by the CRIME_IP*_CAUSES constants. CRIME signals the processor when a bit in a group asserts or de-asserts (established, PDF 106). Table 5-6 (PDF 109) pairs IP2 to IP6 with cause register bits 10 to 14 and SysAD bits 0 to 4. The prose on PDF 109 and PDF 110 swaps bits 20 and 21. Table 5-5, Table 5-10 (PDF 116) and the revision note on PDF 233 do not, so bit 20 is the CPU interface error and bit 21 the memory error (established)."""

[words.INTBIT.fields]
vice = { bits = [31, 31], grade = "established", doc = "Read by the IRIX VICE probe, which never writes this word to acknowledge it (established, kernel add_vice). Whether the bit stays set after the VICE cause is cleared, and so whether a later guest that unmasks it sees a spurious interrupt, is unknown." }
syscorerr = { bits = [30, 30], grade = "established" }
soft1 = { bits = [29, 29], grade = "established", doc = "Registered by the shipped IRIX kernel as its priority 2 software interrupt; the role is inferred from the software interrupt word." }
soft0 = { bits = [28, 28], grade = "established", doc = "Registered by the shipped IRIX kernel as its priority 1 software interrupt; the role is inferred from the software interrupt word." }
re_idle = { bits = [27, 27], grade = "established" }
re_full = { bits = [26, 26], grade = "established", doc = "The shipped IRIX kernel's reading: the renderer interface buffer is above its full level." }
re_empty = { bits = [25, 25], grade = "established", doc = "The shipped IRIX kernel's reading: the renderer interface buffer is at or below its empty level." }
re_idle_edge = { bits = [24, 24], grade = "established" }
re_full_edge = { bits = [23, 23], grade = "established" }
re_empty_edge = { bits = [22, 22], grade = "established" }
mem_error = { bits = [21, 21], grade = "established", doc = "One shipped IRIX kernel handler serves this input and the CPU error input as bus errors." }
cpu_error = { bits = [20, 20], grade = "established", doc = "One shipped IRIX kernel handler serves this input and the memory error input as bus errors; which input the silicon raises for CPU errors is unknown." }
gbe3 = { bits = [19, 19], grade = "established", doc = "The shipped IRIX kernel does not use GBE line 3." }
gbe2 = { bits = [18, 18], grade = "established", doc = "The shipped IRIX kernel does not use GBE line 2." }
gbe1 = { bits = [17, 17], grade = "established", doc = "The shipped IRIX kernel takes this as pre-blank (GBE line 1)." }
gbe0 = { bits = [16, 16], grade = "established", doc = "The shipped IRIX kernel takes this as vertical retrace (GBE line 0)." }
mace = { bits = [15, 0], grade = "established", doc = "The shipped IRIX kernel registers the MACE ISA interrupt on input 4 or 5." }

[[words.INTBIT.tests]]
value = 0x10000
expect = { gbe0 = 1, gbe1 = 0, mace = 0 }

[[words.INTBIT.tests]]
value = 0x4000000
expect = { re_full = 1, re_empty = 0 }

[constants]
ID_FAMILY_SHIPPED = { value = 0xa0, grade = "established", doc = "family nibble of every shipped part, revision nibble 1-15" }
ID_LOW_BYTE_DRAFT = { value = 0xb1, grade = "inferred", doc = "The shipped IRIX graphics probe refuses it. draft specification 1.5 value, never seen on shipped parts; the spec gives it as the 1.5 reset value (established, PDF 114), but no shipped part has been read" }
IP2_CAUSES = { value = 0x8FC00038, grade = "established", doc = "INTBIT bits on processor level IP2: VICE (31), rendering engine (27 to 22), MACE misc, serial and parallel, Ethernet (5, 4, 3); Table 5-5, PDF 106 to 108" }
IP3_CAUSES = { value = 0x000FFF07, grade = "established", doc = "INTBIT bits on IP3: GBE (19 to 16), MACE PCI inputs (15 to 8), MACE video (2 to 0)" }
IP4_CAUSES = { value = 0x10000000, grade = "established", doc = "INTBIT bit on IP4: software interrupt 0 (28)" }
IP5_CAUSES = { value = 0x20000040, grade = "established", doc = "INTBIT bits on IP5: software interrupt 1 (29), MACE audio (6)" }
IP6_CAUSES = { value = 0x40300080, grade = "established", doc = "INTBIT bits on IP6: CPU SysCorErr (30), memory error (21), CPU interface error (20), MACE PCI error (7)" }
ID_LOW_BYTE_SHIPPED = { value = 0xa1, grade = "established", doc = "the only low byte accepted for graphics; the kernel probe itself tests family 0xa and refuses byte 0xa0, see ID_FAMILY_ACCEPTED and ID_REFUSED_BYTE" }
MEM_BANKS = { value = 0x8, grade = "established", doc = "memory bank control registers" }
MEM_BANK_CONTROL_RESET_BASE = { value = 0x0, grade = "established", doc = "reset of bank 0" }
MEM_BANK_CONTROL_RESET_STEP = { value = 0x1, grade = "established", doc = "reset of bank n is BASE + n * STEP" }
PHYS_FULL_MEM_BASE = { value = 0x40000000, grade = "established", doc = "all memory, up to 1 GiB; the only memory window GBE and (with the no-ECC alias) VICE see" }
PHYS_FULL_MEM_BYTES = { value = 0x40000000, grade = "established" }
PHYS_HIGH_ALIAS_BASE = { value = 0x20000000, grade = "established", doc = "as a window; its responder is open in the specification" }
PHYS_HIGH_ALIAS_BYTES = { value = 0x20000000, grade = "established", doc = "512 MiB; inferred to be the upper half of the full window" }
PHYS_LOW_ALIAS_BASE = { value = 0x0, grade = "established", doc = "first 256 MiB, so KSEG0 needs no TLB entry" }
PHYS_LOW_ALIAS_BYTES = { value = 0x10000000, grade = "established" }
PHYS_NOECC_MEM_BASE = { value = 0x80000000, grade = "established", doc = "skips ECC check and correction on reads and writes; ECC is still generated on writes" }
PHYS_NOECC_MEM_BYTES = { value = 0x40000000, grade = "established" }
WATCHDOG_COUNT_BITS = { value = 0x14, grade = "established" }
BLOCK_ADDR = { value = 0x14000000, grade = "established", from = "shipped IRIX O2 graphics objects, per kudzu docs/crime.md", doc = "Physical address of the CRIME block, as the graphics probe reads it." }
GBE_WINDOW_ADDR = { value = 0x16000000, grade = "inferred", from = "published CRIME 1.5 draft specification (rev 0.3), PDF pages 47-52", doc = "CPU window the specification gives for the GBE block. Not confirmed by the binaries; the GBE page keeps the GBE block base as unknown." }
FRAME_APERTURE_ADDR = { value = 0x10000000, grade = "inferred", from = "published CRIME 1.5 draft specification (rev 0.3), PDF pages 47-52", doc = "Frame-buffer aperture, 32 MiB." }
DEPTH_APERTURE_ADDR = { value = 0x12000000, grade = "inferred", from = "published CRIME 1.5 draft specification (rev 0.3), PDF pages 47-52", doc = "Depth-buffer aperture, 32 MiB." }
MACE_WINDOW_ADDR = { value = 0x18000000, grade = "inferred", from = "published CRIME 1.5 draft specification (rev 0.3), PDF pages 47-52", doc = "Start of the MACE window, which runs to 0x1fffffff." }
ID_FAMILY_ACCEPTED = { value = 0xa, grade = "established", from = "shipped IRIX O2 graphics objects, per kudzu docs/crime.md", doc = "Value of bits 7:4 of the identity byte that the graphics probe accepts." }
ID_REFUSED_BYTE = { value = 0xa0, grade = "established", from = "shipped IRIX O2 graphics objects, per kudzu docs/crime.md", doc = "Identity byte the graphics probe refuses even though its family is accepted." }
TIME_RESOLUTION = { value = 0x3a98, grade = "established", from = "shipped IRIX O2 graphics objects, per kudzu docs/crime.md", doc = "Resolution the shipped IRIX kernel states for the time counter. The unit is inferred to be picoseconds, a 66.67 MHz tick." }
IRQ_MACE_ISA_A = { value = 4, grade = "established", from = "shipped IRIX O2 graphics objects, per kudzu docs/crime.md", doc = "MACE ISA interrupt input; the shipped IRIX kernel registers 4 or 5." }
IRQ_MACE_ISA_B = { value = 5, grade = "established", from = "shipped IRIX O2 graphics objects, per kudzu docs/crime.md", doc = "MACE ISA interrupt input; the shipped IRIX kernel registers 4 or 5." }
LINE_MATCH_LATCHES = { value = 4, grade = "inferred", from = "published GBE 1.1 specification", doc = "Line-match interrupts that latch in CRIME; only software clears them there." }
