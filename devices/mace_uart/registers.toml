# Hardware definitions. Edit this file; generated/ is generated from it.
unit = "mace_uart"
prefix = "MACE_UART"
title = "O2 MACE external 16550-compatible serial port: modem control and scratch registers"
doc = "One external serial port of the MACE chip, a 16550-compatible UART. Offsets are from each port's base (the serial base constants in mace_periph.toml). Only the modem control and scratch registers are defined here; the rest of the register set is in docs/mace-base.md."
from = "TI TL16PIR552PH data sheet, SLLS222A (December 1995, revised August 1996)"
public_from = ["TI TL16PIR552PH data sheet, SLLS222A (December 1995, revised August 1996)"]

# The register facts come from a chip-level datasheet for a part whose
# identity in the O2 is not yet established, so every item is graded inferred.

[registers.mcr]
offset = 0x400
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
doc = """
Modem control register of one port. Master reset clears every bit, and bits 6 and 7 are permanently zero (inferred, printed page 25). Bit 3 enables the port's external serial interrupt output (inferred, printed page 30)."""

[registers.mcr.fields]
ext_int_enable = { bits = [3, 3], grade = "inferred", doc = "1 enables the external serial interrupt output. 0 disables it (printed page 30)." }

[registers.scratch]
offset = 0x700
access = "rw"
width = 8
grade = "inferred"
doc = """
Scratch byte for programmer use, with DLAB clear. Master reset has no effect on it (inferred, printed page 25). With DLAB set, the same position holds the clock prescaler and the infrared select. That use has no field here: the sources disagree on the infrared bit, which docs/mace-base.md records."""
