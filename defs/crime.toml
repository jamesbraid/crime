# Hardware definitions. Edit this file; gen/ is generated from it.
unit = "crime"
prefix = "CRIME"
title = "O2 CRIME memory controller and CPU interface registers"
doc = "CRIME memory controller and CPU-interface registers, and the interrupt input bit positions."
from = "published CRIME 1.5 draft specification (rev 0.3), public Linux and NetBSD O2 drivers, and shipped IRIX software readings"
public_from = ["published CRIME 1.5 draft specification"]

[c]
legacy_header = "CRIME_DECODE.h"
legacy_guard = "CRIME_DECODE_H"

[registers.id]
offset = 0x0
access = "r"
width = 64
grade = "established"

[registers.id.fields]
family = { bits = [7, 4], grade = "established" }
rev = { bits = [3, 0], grade = "established" }

[[registers.id.tests]]
value = 0xa1
expect = { family = 10, rev = 1 }

[registers.control]
offset = 0x8
access = "rw"
width = 64
grade = "established"
reset = 0x0

[registers.control.fields]
sysadc_gen_enable = { bits = [13, 13], grade = "established" }
sysadc_check_enable = { bits = [12, 12], grade = "established" }
cold_reset = { bits = [11, 11], grade = "established" }
soft_reset = { bits = [10, 10], grade = "established" }
watchdog_enable = { bits = [9, 9], grade = "established" }
endian = { bits = [8, 8], grade = "established" }

[[registers.control.tests]]
value = 0x2200
expect = { sysadc_gen_enable = 1, sysadc_check_enable = 0, watchdog_enable = 1 }

[registers.intstat]
offset = 0x10
access = "r"
width = 64
grade = "established"

[registers.intmask]
offset = 0x18
access = "rw"
width = 64
grade = "established"
reset = 0x0

[registers.softint]
offset = 0x20
access = "rw"
width = 64
grade = "established"
reset = 0x0

[registers.hardint]
offset = 0x28
access = "rw"
width = 64
grade = "established"

[registers.watchdog]
offset = 0x30
access = "rw"
width = 64
grade = "established"
reset = 0x0

[registers.watchdog.fields]
warm_reset_timeout = { bits = [20, 20], grade = "established" }
count = { bits = [19, 0], grade = "established" }

[registers.cpu_error_addr]
offset = 0x40
access = "r"
width = 64
grade = "established"

[registers.cpu_error_stat]
offset = 0x48
access = "rw"
width = 64
grade = "established"
reset = 0x0

[registers.cpu_error_stat.fields]
illegal_addr = { bits = [2, 2], grade = "established" }
vice_write_parity = { bits = [1, 1], grade = "established" }
cpu_write_parity = { bits = [0, 0], grade = "established" }

[[registers.cpu_error_stat.tests]]
value = 0x4
expect = { illegal_addr = 1, cpu_write_parity = 0 }

[registers.cpu_error_ena]
offset = 0x50
access = "rw"
width = 64
grade = "inferred"

[registers.vice_error_addr]
offset = 0x58
access = "r"
width = 64
grade = "established"

[registers.mem_control]
offset = 0x200
access = "rw"
width = 64
grade = "established"
reset = 0x0

[registers.mem_control.fields]
use_repl_check = { bits = [1, 1], grade = "established" }
ecc_enable = { bits = [0, 0], grade = "established" }

[registers.mem_bank_control]
offset = 0x208
access = "rw"
width = 64
grade = "established"
count = 8

[registers.mem_bank_control.fields]
sdram_geometry = { bits = [8, 8], grade = "established" }
base_match = { bits = [4, 0], grade = "established" }

[registers.mem_error_stat]
offset = 0x250
access = "rw"
width = 64
grade = "established"
doc = """
Reset values differ per bank, so the REG line's reset=unknown stands for none of them: bank n resets to n for n = 0 to 7
(established, [spec] table 6-14; no shipped software writes banks 2 to 7). With 32 MiB parts that puts bank n at n * 32 MiB.
#define CRIME_MEM_BANK_CONTROL_RESET_BASE 0 /* established: reset of bank 0
#define CRIME_MEM_BANK_CONTROL_RESET_STEP 1 /* established: reset of bank n is BASE + n * STEP"""

[registers.mem_error_stat.fields]
invalid_addr_rmw = { bits = [27, 27], grade = "established" }
invalid_addr_write = { bits = [26, 26], grade = "established" }
invalid_addr_read = { bits = [25, 25], grade = "established" }
ecc_error_rmw = { bits = [24, 24], grade = "established" }
ecc_error_read = { bits = [23, 23], grade = "established" }
multiple_errors = { bits = [22, 22], grade = "established" }
hard_error = { bits = [21, 21], grade = "established" }
soft_error = { bits = [20, 20], grade = "established" }
cpu_access = { bits = [18, 18], grade = "established" }
vice_access = { bits = [17, 17], grade = "established" }
gbe_access = { bits = [16, 16], grade = "established" }
re_access = { bits = [15, 15], grade = "established" }
re_id = { bits = [14, 8], grade = "established" }
mace_access = { bits = [7, 7], grade = "established" }
mace_id = { bits = [6, 0], grade = "established" }

[registers.mem_error_addr]
offset = 0x258
access = "r"
width = 64
grade = "established"

[registers.mem_error_ecc_syn]
offset = 0x260
access = "r"
width = 64
grade = "established"

[registers.mem_error_ecc_chk]
offset = 0x268
access = "r"
width = 64
grade = "established"

[registers.mem_error_ecc_repl]
offset = 0x270
access = "rw"
width = 64
grade = "established"

[registers.mem_error_ecc_repl.fields]
check = { bits = [7, 0], grade = "established" }

[registers.cpu_error_stat_15]
offset = 0x4048
access = "rw"
width = 64
grade = "inferred"
reset = 0x0

[words.INTBIT]
width = 32
grade = "established"

[words.INTBIT.fields]
vice = { bits = [31, 31], grade = "established" }
syscorerr = { bits = [30, 30], grade = "established" }
soft1 = { bits = [29, 29], grade = "established" }
soft0 = { bits = [28, 28], grade = "established" }
re_idle = { bits = [27, 27], grade = "established" }
re_full = { bits = [26, 26], grade = "established" }
re_empty = { bits = [25, 25], grade = "established" }
re_idle_edge = { bits = [24, 24], grade = "established" }
re_full_edge = { bits = [23, 23], grade = "established" }
re_empty_edge = { bits = [22, 22], grade = "established" }
mem_error = { bits = [21, 21], grade = "established" }
cpu_error = { bits = [20, 20], grade = "established" }
gbe3 = { bits = [19, 19], grade = "established" }
gbe2 = { bits = [18, 18], grade = "established" }
gbe1 = { bits = [17, 17], grade = "established" }
gbe0 = { bits = [16, 16], grade = "established" }
mace = { bits = [15, 0], grade = "established" }

[[words.INTBIT.tests]]
value = 0x10000
expect = { gbe0 = 1, gbe1 = 0, mace = 0 }

[[words.INTBIT.tests]]
value = 0x4000000
expect = { re_full = 1, re_empty = 0 }

[constants]
ID_FAMILY_SHIPPED = { value = 0xa0, grade = "established", doc = "family nibble of every shipped part, revision nibble 1-15" }
ID_LOW_BYTE_DRAFT = { value = 0xb1, grade = "inferred", doc = "draft specification 1.5 value, never seen on shipped parts" }
ID_LOW_BYTE_SHIPPED = { value = 0xa1, grade = "established", doc = "the only low byte accepted for graphics" }
MEM_BANKS = { value = 0x8, grade = "established", doc = "memory bank control registers" }
MEM_BANK_CONTROL_RESET_BASE = { value = 0x0, grade = "established", doc = "reset of bank 0" }
MEM_BANK_CONTROL_RESET_STEP = { value = 0x1, grade = "established", doc = "reset of bank n is BASE + n * STEP" }
PHYS_FULL_MEM_BASE = { value = 0x40000000, grade = "established", doc = "all memory, up to 1 GiB; the only memory window GBE and (with the no-ECC alias) VICE see" }
PHYS_FULL_MEM_BYTES = { value = 0x40000000, grade = "established" }
PHYS_HIGH_ALIAS_BASE = { value = 0x20000000, grade = "established", doc = "as a window; its responder is open in the specification" }
PHYS_HIGH_ALIAS_BYTES = { value = 0x20000000, grade = "established", doc = "512 MiB; inferred to be the upper half of the full window" }
PHYS_LOW_ALIAS_BASE = { value = 0x0, grade = "established", doc = "first 256 MiB, so KSEG0 needs no TLB entry" }
PHYS_LOW_ALIAS_BYTES = { value = 0x10000000, grade = "established" }
PHYS_NOECC_MEM_BASE = { value = 0x80000000, grade = "established", doc = "skips ECC check and correction on reads and writes; ECC is still generated on writes" }
PHYS_NOECC_MEM_BYTES = { value = 0x40000000, grade = "established" }
WATCHDOG_COUNT_BITS = { value = 0x14, grade = "established" }
