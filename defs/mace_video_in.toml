# Hardware definitions. Edit this file; gen/ is generated from it.
unit = "mace_video_in"
prefix = "VIN"
title = "O2 MACE video input channel registers"
doc = "MACE video input channel registers."
from = "published MACE 2.0 specification, video chapter, and shipped IRIX software readings"
public_from = ["published MACE 2.0 specification", "shipped IRIX"]

[c]
legacy_header = "MACE_VIDEO_IN_DECODE.h"
legacy_guard = "MACE_VIDEO_IN_DECODE_H"

[spaces.mace_video_in]

[registers.control]
offset = 0x0
access = "rw"
width = 64
grade = "established"
reset = 0x0
space = "mace_video_in"
doc = "The shipped IRIX video driver writes the whole word, changing only its low nine bits."

[registers.control.fields]
int_gpib = { bits = [9, 9], grade = "established" }
int_crime_error = { bits = [8, 8], grade = "established" }
int_fifo_overflow = { bits = [7, 7], grade = "established" }
int_v_overflow = { bits = [6, 6], grade = "established" }
int_h_overflow = { bits = [5, 5], grade = "established" }
int_buffer = { bits = [4, 4], grade = "established" }
int_lost_sync = { bits = [3, 3], grade = "established" }
int_dma_done = { bits = [2, 2], grade = "established" }
int_vsync = { bits = [1, 1], grade = "established" }
dma_enable = { bits = [0, 0], grade = "established" }

[registers.status]
offset = 0x8
access = "r"
width = 64
grade = "established"
reset = 0x0
space = "mace_video_in"

[registers.status.fields]
sync_present = { bits = [10, 10], grade = "established" }
gpib = { bits = [9, 9], grade = "established" }
crime_error = { bits = [8, 8], grade = "established" }
fifo_overflow = { bits = [7, 7], grade = "established" }
v_overflow = { bits = [6, 6], grade = "established" }
h_overflow = { bits = [5, 5], grade = "established" }
buffer = { bits = [4, 4], grade = "established" }
lost_sync = { bits = [3, 3], grade = "established" }
dma_done = { bits = [2, 2], grade = "established" }
vsync = { bits = [1, 1], grade = "established" }
dma_active = { bits = [0, 0], grade = "established" }

[registers.config]
offset = 0x10
access = "rw"
width = 64
grade = "established"
space = "mace_video_in"

[registers.config.fields]
interleaved = { bits = [16, 16], grade = "established" }
dither = { bits = [13, 13], grade = "established" }
sof_count = { bits = [9, 6], grade = "established" }
d1_ecc = { bits = [5, 5], grade = "established" }
d1_precision = { bits = [4, 4], grade = "established" }
d1_reset = { bits = [1, 1], grade = "established" }
channel_reset = { bits = [0, 0], grade = "established" }

[registers.config.fields.mem_mode]
bits = [15, 14]
grade = "established"

[registers.config.fields.mem_mode.enums]
linear = { value = 0, grade = "established" }
tiled = { value = 1, grade = "established" }
mipmap_512x128 = { value = 2, grade = "established" }
mipmap_512x256 = { value = 3, grade = "established" }

[registers.config.fields.pixel_format]
bits = [12, 10]
grade = "established"

[registers.config.fields.pixel_format.enums]
rgba32 = { value = 0, grade = "established" }
rgba5551 = { value = 1, grade = "established" }
yuv422_8 = { value = 2, grade = "established" }
yuv422_10 = { value = 3, grade = "established" }
abgr32 = { value = 4, grade = "established" }
yuva4224 = { value = 5, grade = "established" }

[registers.config.fields.source]
bits = [3, 2]
grade = "established"

[registers.config.fields.source.enums]
primary = { value = 0, grade = "established" }
secondary = { value = 1, grade = "established" }
loopback_e = { value = 2, grade = "established" }
loopback_f = { value = 3, grade = "established" }

[registers.next_desc]
offset = 0x18
access = "rw"
width = 64
grade = "established"
space = "mace_video_in"
doc = "The shipped IRIX video driver holds the physical address as a zero-extended 32-bit word and ORs a flag byte into it; which bits carry the flag is not stated."

[registers.next_desc.fields]
table_address = { bits = [31, 6], grade = "established", doc = "Physical address of the 64-byte descriptor table (printed page 44, table 12)." }
valid = { bits = [2, 2], grade = "established", doc = "Software sets it to queue a descriptor. Hardware clears it after copying the descriptor. A clear bit skips the next field (printed pages 44 and 45, tables 12 and 13)." }

[registers.next_desc.fields.field_select]
bits = [1, 0]
grade = "established"
doc = "Field the queued descriptor starts on. Values 0 and 1 both take either field ID, 2 waits for an odd field and 3 waits for an even field (printed page 44, table 12)."

[registers.next_desc.fields.field_select.enums]
either = { value = 0, grade = "established" }
odd = { value = 2, grade = "established" }
even = { value = 3, grade = "established" }

[registers.fld_offset]
offset = 0x20
access = "rw"
width = 64
grade = "established"
space = "mace_video_in"
doc = "The shipped IRIX video driver writes the low halfword of a transfer-record word here."

[registers.fld_offset.fields]
byte_offset = { bits = [15, 3], grade = "established", doc = "Byte offset of the first pixel within the first 64 KiB page, stored literally with no adjustment (printed page 45, table 14)." }

[registers.line_width]
offset = 0x28
access = "rw"
width = 64
grade = "established"
space = "mace_video_in"
doc = "The shipped IRIX video driver's start-up writes it with a 64-bit store."

[registers.line_width.fields]
bytes = { bits = [11, 3], grade = "established", doc = "Input line width in bytes, a multiple of eight, stored literally. It is neither a pixel count nor minus one (printed page 45, table 15)." }

[registers.hclip_odd]
offset = 0x30
access = "rw"
width = 64
grade = "established"
space = "mace_video_in"

[registers.hclip_odd.fields]
start = { bits = [9, 0], grade = "established", doc = "Stored start. The first captured pixel is start plus 2, counted from the first pixel after the EAV code (printed pages 46 and 47, table 17)." }
end = { bits = [19, 10], grade = "established", doc = "Stored end. The captured pixel count is end minus start plus 1 (printed pages 46 and 47, table 17)." }
filt_count = { bits = [29, 20], grade = "established", doc = "Pixels per line at the output of the non-square filter. The table uses it only with that filter and says it must be even (printed pages 46 and 47, table 17)." }
scale_ratio = { bits = [37, 30], grade = "established", doc = "Eight-bit horizontal ratio: the scaled-down size times 256, used only when scaling is on. The table prints the range as 30:37 (printed pages 46 and 47, table 17)." }
scale_on = { bits = [38, 38], grade = "established", doc = "One enables horizontal down-scaling, zero is no scaling (printed pages 46 and 47, table 17)." }

[registers.hclip_odd.fields.filter_mode]
bits = [40, 39]
grade = "established"
doc = "Non-square to square filter. The table prints the range as 39:40 (printed pages 46 and 47, table 17). Its PAL and NTSC ratios differ from the overview; see the conflicts in docs/mace-video.md."

[registers.hclip_odd.fields.filter_mode.enums]
none = { value = 0, grade = "established" }
pal_nonsquare = { value = 1, grade = "established" }
ntsc_nonsquare = { value = 2, grade = "established" }
half = { value = 3, grade = "established" }

[registers.vclip_odd]
offset = 0x38
access = "rw"
width = 64
grade = "established"
space = "mace_video_in"

[registers.vclip_odd.fields]
start = { bits = [9, 0], grade = "established", doc = "First captured line, counted from the first line after decoded start of field (printed pages 48 and 49, table 18)." }
blank_end = { bits = [19, 10], grade = "established", doc = "Leading black-fill boundary in lines. Its effect on the captured lines is a reviewed interpretation and is not recorded here (printed pages 48 and 49)." }
end = { bits = [29, 20], grade = "established", doc = "Last captured line, inclusive. The captured line count is end minus start plus 1 (printed pages 48 and 49, table 18)." }
scale_ratio = { bits = [37, 30], grade = "established", doc = "Eight-bit vertical ratio: the scaled-down size times 256, used only when scaling is on (printed pages 48 and 49, table 18)." }
scale_on = { bits = [38, 38], grade = "established", doc = "One enables vertical down-scaling, zero is no scaling (printed pages 48 and 49, table 18)." }

[registers.alpha_odd]
offset = 0x40
access = "rw"
width = 64
grade = "inferred"
space = "mace_video_in"

[registers.hclip_even]
offset = 0x48
access = "rw"
width = 64
grade = "established"
space = "mace_video_in"

[registers.hclip_even.fields]
start = { bits = [9, 0], grade = "established", doc = "Stored start. The first captured pixel is start plus 2, counted from the first pixel after the EAV code (printed pages 46 and 47, table 17)." }
end = { bits = [19, 10], grade = "established", doc = "Stored end. The captured pixel count is end minus start plus 1 (printed pages 46 and 47, table 17)." }
filt_count = { bits = [29, 20], grade = "established", doc = "Pixels per line at the output of the non-square filter. The table uses it only with that filter and says it must be even (printed pages 46 and 47, table 17)." }
scale_ratio = { bits = [37, 30], grade = "established", doc = "Eight-bit horizontal ratio: the scaled-down size times 256, used only when scaling is on. The table prints the range as 30:37 (printed pages 46 and 47, table 17)." }
scale_on = { bits = [38, 38], grade = "established", doc = "One enables horizontal down-scaling, zero is no scaling (printed pages 46 and 47, table 17)." }

[registers.hclip_even.fields.filter_mode]
bits = [40, 39]
grade = "established"
doc = "Non-square to square filter. The table prints the range as 39:40 (printed pages 46 and 47, table 17). Its PAL and NTSC ratios differ from the overview; see the conflicts in docs/mace-video.md."

[registers.hclip_even.fields.filter_mode.enums]
none = { value = 0, grade = "established" }
pal_nonsquare = { value = 1, grade = "established" }
ntsc_nonsquare = { value = 2, grade = "established" }
half = { value = 3, grade = "established" }

[registers.vclip_even]
offset = 0x50
access = "rw"
width = 64
grade = "established"
space = "mace_video_in"

[registers.vclip_even.fields]
start = { bits = [9, 0], grade = "established", doc = "First captured line, counted from the first line after decoded start of field (printed pages 48 and 49, table 18)." }
blank_end = { bits = [19, 10], grade = "established", doc = "Leading black-fill boundary in lines. Its effect on the captured lines is a reviewed interpretation and is not recorded here (printed pages 48 and 49)." }
end = { bits = [29, 20], grade = "established", doc = "Last captured line, inclusive. The captured line count is end minus start plus 1 (printed pages 48 and 49, table 18)." }
scale_ratio = { bits = [37, 30], grade = "established", doc = "Eight-bit vertical ratio: the scaled-down size times 256, used only when scaling is on (printed pages 48 and 49, table 18)." }
scale_on = { bits = [38, 38], grade = "established", doc = "One enables vertical down-scaling, zero is no scaling (printed pages 48 and 49, table 18)." }

[registers.alpha_even]
offset = 0x58
access = "rw"
width = 64
grade = "inferred"
space = "mace_video_in"

[registers.dma_desc]
offset = 0x80
access = "rw"
width = 64
grade = "established"
count = 8
space = "mace_video_in"
