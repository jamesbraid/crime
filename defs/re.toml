[registers.aa_line]
offset = 0x2190
access = "w"
width = 32
grade = "established"
space = "re"
doc = """
Antialiasing applies only to point and line primitives and only to RGB(A) pixels. It acts on alpha after fogging and before the alpha test. For antialiased lines the specification assumes a line width of two (established, [spec] PDF 206, section 7.3.7.10). The coverage value is a 0.8 fixed-point number, computed from a 128 by 8 slope-and-distance table and a 128 by 4-bit endpoint table, both in ROM (established, [spec] PDF 206-207). The ROM contents are not published, so they are unknown.
The register table gives this word as a 2.12 two's complement value for both the slope and the ideal minor coordinate (established, [spec] register map, PDF 169). docs/context.md reads the slope from the same table as 2.14 in bits 31:16. That conflicts with this layout and is not resolved here."""

[registers.aa_cov]
offset = 0x2194
access = "w"
width = 32
grade = "established"
space = "re"

[registers.alphatest]
offset = 0x2198
access = "rw"
width = 32
grade = "established"
space = "re"
doc = """
Alpha test function and reference. Bits 31:12 are reserved in the specification.
The test runs on fragment alpha after antialias coverage and only for RGB(A)
pixels, and it is enabled by DrawMode bit 11. A fragment whose comparison fails
is discarded."""

[registers.alphatest.fields.func]
bits = [11, 8]
grade = "established"
from = "published CRIME 1.5 draft specification, PDF page 180"
doc = "Comparison function, codes 0 to 7 as in the enum. Codes 8 to 15 have no meaning in the specification's table; their behaviour is unknown."

[registers.alphatest.fields.func.enums]
never = { value = 0, grade = "established", from = "published CRIME 1.5 draft specification, PDF page 207" }
less = { value = 1, grade = "established", from = "published CRIME 1.5 draft specification, PDF page 207" }
equal = { value = 2, grade = "established", from = "published CRIME 1.5 draft specification, PDF page 207" }
lequal = { value = 3, grade = "established", from = "published CRIME 1.5 draft specification, PDF page 207" }
greater = { value = 4, grade = "established", from = "published CRIME 1.5 draft specification, PDF page 207" }
notequal = { value = 5, grade = "established", from = "published CRIME 1.5 draft specification, PDF page 207" }
gequal = { value = 6, grade = "established", from = "published CRIME 1.5 draft specification, PDF page 207" }
always = { value = 7, grade = "established", from = "published CRIME 1.5 draft specification, PDF page 207" }

[registers.alphatest.fields.ref]
bits = [7, 0]
grade = "established"
from = "published CRIME 1.5 draft specification, PDF page 180"
doc = "8-bit reference value that the fragment alpha is compared with."

[registers.blend_color]
offset = 0x21a0
access = "rw"
width = 32
grade = "established"
space = "re"
doc = """
Blend constant colour, read and written as a 32-bit word (established, [spec] register map, PDF 169, which names it "blend RGBA constant color"). The constant-color and constant-alpha factor codes of Blend.func select it. The specification does not draw its per-byte layout, so the byte order is unknown."""

[registers.blend_func]
offset = 0x21a8
access = "rw"
width = 32
grade = "established"
space = "re"
doc = """
Blend equation and factors. The source factor table has a SRC_ALPHA_SATURATE row with no factor given, and the destination factor table has no such code (established absence, [spec] Tables 7-20 and 7-21, PDF 208-209). The specification's factor arithmetic therefore omits it. It also gives no clamp for ADD or SUBTRACT. Both are unknown here; see docs/pixel-arithmetic.md."""

[registers.blend_func.fields.op]
bits = [11, 8]
grade = "established"

[registers.blend_func.fields.op.enums]
add = { value = 0, grade = "established" }
min = { value = 1, grade = "established" }
max = { value = 2, grade = "established" }
subtract = { value = 3, grade = "established" }
reverse_subtract = { value = 4, grade = "established" }

[registers.blend_func.fields.src]
