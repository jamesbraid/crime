[words.IBADDR_HI]
width = 32
doc = """
ib_addr holds the address half of each queued write. Software decodes its
upper 32 bits (IBADDR_HI, the word at the register's own address in
big-endian layout) as the register's doubleword index within its group, the
group, a byte lane code and one flag bit; the hardware meaning of the lane
code and the flag is inferred. The index is address bits 10:3 and the group
is address bits 14:12 of the register; bit 11, the start alias, is the
address bit left out, so the flag is inferred to mark an entry written
through the start alias. Replay by software writes lane 3 as one
doubleword, lane 2 as the first (upper) data word at the register address,
lane 1 as the second data word four bytes higher, and treats lane 0 as an
error that writes nothing. The lower 32 bits are not decoded by any shipped
software read."""
grade = "inferred"

[words.IBADDR_HI.fields]
start_flag = { bits = [13, 13], grade = "inferred" }
index = { bits = [7, 0], grade = "established" }

[words.IBADDR_HI.fields.lane]
bits = [12, 11]
grade = "inferred"

[words.IBADDR_HI.fields.lane.enums]
none = { value = 0, grade = "inferred" }
word1 = { value = 1, grade = "inferred" }
word0 = { value = 2, grade = "inferred" }
dword = { value = 3, grade = "inferred" }

[words.IBADDR_HI.fields.group]
bits = [10, 8]
grade = "established"

[words.IBADDR_HI.fields.group.enums]
interface = { value = 0, grade = "established" }
tlb = { value = 1, grade = "established" }
pixel_pipe = { value = 2, grade = "established" }
transfer = { value = 3, grade = "established" }

[[words.IBADDR_HI.tests]]
value = 0x1a0a
kind = "example"
expect = { index = 10, group = 2, lane = 3, start_flag = 0 }

[words.LINENT]
width = 32
doc = """
Each doubleword holds two 32-bit page entries, the even page in the upper
word and the odd page in the lower word. Software indexes a table with
address bits 16:13 and stores a page number with its top bit set, which is
inferred to be a valid bit. LINENT describes one such entry."""
grade = "inferred"

[words.LINENT.fields]
valid = { bits = [31, 31], grade = "inferred" }
page = { bits = [30, 0], grade = "established" }

[[words.LINENT.tests]]
value = 0x80000123
expect = { page = 291, valid = 1 }

[words.SCRMASK_HI]
width = 32
doc = """
Each screen mask is one clip rectangle; the end coordinates are exclusive.
The upper word (SCRMASK_HI, at the register's own address in big-endian
layout) holds the start corner and the lower word (SCRMASK_LO) the end
corner."""
grade = "established"

[words.SCRMASK_HI.fields]
x_start = { bits = [31, 16], grade = "established" }
y_start = { bits = [15, 0], grade = "established" }

[words.SCRMASK_LO]
width = 32
grade = "established"

[words.SCRMASK_LO.fields]
x_end = { bits = [31, 16], grade = "established" }
y_end = { bits = [15, 0], grade = "established" }

[words.TLBTILE]
width = 32
grade = "inferred"

[words.TLBTILE.fields]
valid = { bits = [15, 15], grade = "inferred" }
page = { bits = [14, 0], grade = "established" }

[constants]
IB_ENTRIES = { value = 0x40, grade = "established", doc = "shipped software walks the buffer as a ring of 64; the specification text says 128" }
LIN_TLB_REGS = { value = 0x10, grade = "established", doc = "doublewords per linear table, two page entries each" }
START_ALIAS_BIT = { value = 0xb, grade = "established", doc = "address bit that selects the start alias of a register" }
TLB_ENTRIES_PER_REG = { value = 0x4, grade = "established", doc = "four 16-bit tile entries in each frame-buffer, texture and clip-ID doubleword" }
TLB_TILE_SHIFT = { value = 0x10, grade = "established", doc = "entry is the physical address >> 16 (64 KiB tiles)" }
