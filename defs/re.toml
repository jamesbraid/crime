# Hardware definitions. Edit this file; gen/ is generated from it.
unit = "re"
prefix = "RE"
title = "O2 CRIME rendering engine: interface buffer, linear TLBs and clip state"
doc = "CRIME rendering engine interface buffer, translation tables, pixel pipeline registers and status."
from = "published CRIME 1.5 draft specification, public NetBSD O2 framebuffer driver, and shipped IRIX software readings"
public_from = ["published CRIME 1.5 draft specification"]

[c]
legacy_header = "RE_DECODE.h"
legacy_guard = "RE_DECODE_H"

[spaces.re]

[registers.ib_data]
offset = 0x0
access = "rw"
width = 64
grade = "established"
count = 64
space = "re"
doc = """
The interface buffer holds 64 queued writes. The specification's table
names 128 entries, but its address half sits 512 bytes above the data
half, which leaves room for 64 doublewords of data, and shipped software
walks a ring of 64 (RE_IB_ENTRIES). Each queued write has a data
doubleword and an address doubleword; the address half is decoded below.
The window shares its low offsets with the CRIME CPU-interface registers,
so the rendering engine registers live in their own address space."""

[registers.ib_addr]
offset = 0x200
access = "rw"
width = 64
grade = "established"
count = 64
space = "re"

[registers.ib_ctl]
offset = 0x400
access = "w"
width = 32
grade = "established"
space = "re"

[registers.ib_ctl.fields]
full = { bits = [27, 21], grade = "inferred" }
empty = { bits = [20, 14], grade = "inferred" }
stall = { bits = [13, 7], grade = "inferred" }
count = { bits = [6, 0], grade = "inferred" }

[[registers.ib_ctl.tests]]
value = 0xfefff0a
expect = { count = 10, stall = 126, empty = 63, full = 127 }

[registers.ib_reset]
offset = 0x408
access = "w"
width = 32
grade = "inferred"
space = "re"

[registers.tlb_fb_a]
offset = 0x1000
access = "rw"
width = 64
grade = "established"
count = 64
space = "re"
doc = """
The frame-buffer tables A, B and C each hold 64 doublewords, the texture
table 28 and the clip-ID table 4. Shipped software loads all of them with
64-bit stores. A frame-buffer, texture or clip-ID doubleword holds four
16-bit tile entries, tile column 0 in bits 63:48. The entry is the physical
address of a 64 KiB tile shifted right by 16 (the page number counted in
64 KiB units). Shipped software sets the top bit of each frame-buffer and
texture entry it uses and writes clip-ID entries without it, so the top
bit is inferred to be a valid bit (and doubles as address bit 31 of the
tile). The register index of tile (x, y) in a frame-buffer table is
y * 4 + x / 4. The linear tables further down use 32-bit entries."""

[registers.tlb_fb_b]
offset = 0x1200
access = "rw"
width = 64
grade = "established"
count = 64
space = "re"

[registers.tlb_fb_c]
offset = 0x1400
access = "rw"
width = 64
grade = "established"
count = 64
space = "re"

