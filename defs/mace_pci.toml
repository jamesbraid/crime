# Hardware definitions. Edit this file; gen/ is generated from it.
unit = "mace_pci"
prefix = "MACE_PCI"
title = "O2 MACE PCI host bridge control registers"
doc = "MACE PCI control block: error capture, interrupt and error enables, read-buffer revision, and the configuration address and data ports. Offsets are from the block base (constant BLOCK_BASE). Unlisted offsets in the block are not implemented."
from = "published MACE 2.0 I/O ASIC specification (printed pages 161 to 165), public Linux MACE PCI accessor, and OpenBSD and NetBSD O2 MACE drivers"
public_from = ["published MACE 2.0 I/O ASIC specification"]

[registers.pci_error_addr]
offset = 0x0
access = "r"
width = 32
grade = "established"
reset = 0x0
doc = """
Captured address of a PCI error. Valid only while the address-valid flag is set (established, printed pages 162 and 163)."""

[registers.pci_error_flags]
offset = 0x4
access = "rw"
width = 32
grade = "established"
doc = """
Error flags. Bits 23 to 31 and bit 4 clear when written as zero; writing one preserves them (established, printed page 162). A bad transaction size may set bit 27; the specification calls that result unexpected, so it is not named here."""

[registers.pci_error_flags.fields]
addr_valid = { bits = [19, 19], grade = "established" }
master_abort = { bits = [31, 31], grade = "established" }

[registers.pci_control]
offset = 0x8
access = "rw"
width = 32
grade = "established"
doc = """
Interrupt enables clear at reset, bits 0 to 7 for the PCI inputs and bits 24 to 31 for error enables (established, printed pages 164 and 162). Reset value of the other bits is not stated."""

[registers.pci_control.fields]
irq_enable = { bits = [7, 0], grade = "established" }
error_enable = { bits = [31, 24], grade = "established" }

[registers.pci_rev]
offset = 0xc
access = "rw"
width = 32
grade = "established"
doc = """
Read-buffer flush and revision. Reads return 1 for MACE 2.0. Writes request buffer invalidation (established, printed pages 161 to 163). The reset value of the read is not stated."""

[registers.pci_cfg_addr]
offset = 0xcf8
access = "rw"
width = 32
grade = "established"
doc = """
Configuration address port, PCI mechanism 1, bus zero on the directly attached bus. Access width is 32 bits for the address write (established, printed page 161)."""

[registers.pci_cfg_data]
offset = 0xcfc
access = "rw"
width = 32
grade = "established"
doc = """
Configuration data port. Accepts 8-, 16-, 24- or 32-bit data access. A missing device gives a master abort, and the specification gives no value to return for it (established, printed pages 161 to 163)."""

[constants]
BLOCK_BASE = { value = 0x1f080000, grade = "established", doc = "physical base of the PCI control block (printed page 161)" }
