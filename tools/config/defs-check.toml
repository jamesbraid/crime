[project]
name = "o2gfx"

[checks]
address_bits = 16

[[banned.extra]]
label = "kernel routine prefix"
regex = '\b(?:crime|crm|gbe)[A-Z]\w*'

[units.crime]
group = "crime"

[units.mte]
group = "mte"

[units.re]
group = "re"

[units.vice]
group = "vice"

[units.mace_video]
group = "mace_video"

[units.mace_video_in]
group = "mace_video_in"

[units.gbe]
group = "gbe"

[units.mace_periph]
group = "mace_periph"

[units.mace_timer]
group = "mace_timer"

[units.mace_i2c]
group = "mace_i2c"

[units.mace_serial_dma]
group = "mace_serial_dma"

[units.mace_uart]
group = "mace_uart"

[units.mace_pci]
group = "mace_pci"
prose_offsets = false

[units.mace_audio]
group = "mace_audio"

[units.mace_ethernet]
group = "mace_ethernet"

[units.ad1843]
group = "ad1843"

[[claims]]
group = "gbe"
label = "dot clock fields"
doc = "devices/gbe/gbe.md"
regex = '`M` (\d+):(\d+), `N` (\d+):(\d+), `P` (\d+):(\d+), run (\d+)'
binds = [
  ["F", "DOTCLOCK.m_minus_1", 1, 2],
  ["F", "DOTCLOCK.n_minus_1", 3, 4],
  ["F", "DOTCLOCK.p", 5, 6],
  ["F", "DOTCLOCK.run", 7],
]

[[claims]]
group = "gbe"
label = "frame size totals"
doc = "devices/gbe/gbe.md"
regex = 'total pixels per line in (\d+):(\d+), total lines in (\d+):(\d+)'
binds = [
  ["F", "VT_XYMAX.htotal", 1, 2],
  ["F", "VT_XYMAX.vtotal", 3, 4],
]

[[claims]]
group = "gbe"
label = "display-ID control"
doc = "devices/gbe/gbe.md"
regex = '`did_base` in bits (\d+):(\d+) \(the upper 16 bits.*?DMA enable in bit (\d+)'
binds = [
  ["F", "DID_CONTROL.did_base", 1, 2],
  ["F", "DID_CONTROL.dma_enable", 3],
]

[[claims]]
group = "gbe"
label = "frame size tile fields"
doc = "devices/gbe/gbe.md"
regex = 'width in whole tiles at (\d+):(\d+), remainder in 32-byte units at (\d+):(\d+), depth at (\d+):(\d+)'
binds = [
  ["F", "FRM_SIZE_TILE.width_tiles", 1, 2],
  ["F", "FRM_SIZE_TILE.remainder", 3, 4],
  ["F", "FRM_SIZE_TILE.depth", 5, 6],
]

[[claims]]
group = "mte"
label = "address word"
doc = "devices/mte/mte.md"
regex = 'one 32-bit word with a column in bits (\d+):(\d+) and a row in bits (\d+):(\d+)'
binds = [
  ["F", "ADDR.byte_col", 1, 2],
  ["F", "ADDR.row", 3, 4],
]
